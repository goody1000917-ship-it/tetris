<title>會考每日練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: one 640px column; sticky header with the exam countdown; fixed bottom tab bar;
   the question card is drawn like a squared exam sheet (方格紙) with 2B-pencil greys,
   a 考卷藍 ink accent, red-pen for wrong and green-pen for right. */
:root{
  --bg:#F1F3F6; --paper:#FFFFFF; --ink:#1B2430; --muted:#5F6B7D; --line:#D5DBE5; --line-soft:#E7EBF1;
  --accent:#2C58B4; --accent-ink:#FFFFFF; --accent-soft:#E4ECFA;
  --ok:#15744A; --ok-soft:#E1F3E9; --bad:#B0321F; --bad-soft:#FBE6E2; --warn:#8A5A08; --warn-soft:#FBF0D6;
  --grid:rgba(44,88,180,.07); --shadow:0 1px 2px rgba(27,36,48,.06),0 8px 24px rgba(27,36,48,.06);
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161F; --paper:#1A2130; --ink:#E9EDF3; --muted:#9BA6B9; --line:#2D3748; --line-soft:#232C3B;
    --accent:#8AADF2; --accent-ink:#0E1626; --accent-soft:#243655;
    --ok:#5CD095; --ok-soft:#17311F; --bad:#F39183; --bad-soft:#3B201B; --warn:#E3B55B; --warn-soft:#3A2D14;
    --grid:rgba(138,173,242,.09); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161F; --paper:#1A2130; --ink:#E9EDF3; --muted:#9BA6B9; --line:#2D3748; --line-soft:#232C3B;
  --accent:#8AADF2; --accent-ink:#0E1626; --accent-soft:#243655;
  --ok:#5CD095; --ok-soft:#17311F; --bad:#F39183; --bad-soft:#3B201B; --warn:#E3B55B; --warn-soft:#3A2D14;
  --grid:rgba(138,173,242,.09); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-inline:16px;padding-block:0 calc(80px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.wrap{max-width:640px;margin:0 auto;min-width:0}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line-soft)}
.hdr h1{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.1;margin:0;letter-spacing:.02em}
.hdr .sub{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-top:4px}
.count{text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.count b{display:block;font-size:22px;line-height:1.1;font-family:var(--font-display)}
.count span{font-size:12px;color:var(--muted)}
main{padding-block:16px;display:grid;gap:14px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.sheet{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;line-height:1;padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--paper);white-space:nowrap}
.chip.math{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chip.social{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.chip.hard{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.chip.review{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
button.chip{cursor:pointer;min-height:32px}
button.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.stem{font-size:17px;line-height:1.75;word-break:break-word;margin:12px 0 4px;text-wrap:pretty}
.rt-wrap{overflow-x:auto;max-width:100%;margin:8px 0}
.rt-table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.rt-table th,.rt-table td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle;word-break:break-word}
.rt-table td{white-space:nowrap}
.rt-table td:has(+ td){white-space:normal}
.rt-table tr>*:last-child{white-space:normal}
.rt-table th{background:var(--accent-soft);color:var(--ink);font-weight:600}
.rt-table th[scope=row]{background:var(--bg);text-align:left}
.rt-kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px;line-height:1.6}
.rt-kv b{font-weight:600;color:var(--muted)}
.rt-kv span{min-width:0;word-break:break-word}
.rt-h{font-weight:700;margin:12px 0 2px}
.rt-h+.rt-kv{margin-top:4px}
.expl p{white-space:normal}
.fig{margin:8px auto 4px;max-width:320px}
.fig svg{display:block;width:100%;height:auto;max-width:100%;color:var(--ink)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);line-height:1.5;transition:border-color .12s,background .12s}
.opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.opt .t{white-space:pre-wrap;word-break:break-word;min-width:0}
.opt:not([disabled]):hover,.opt:not([disabled]):focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default;opacity:.7}
.opt.correct{opacity:1;border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{opacity:1;border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{color:var(--bad)}
.verdict{margin-top:14px;padding:12px 14px;border-radius:10px;display:grid;gap:4px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict b{font-size:17px}
.verdict span{color:var(--ink);font-size:14px}
.why{margin-top:10px;display:grid;gap:6px}
.why .lbl{font-size:13px;color:var(--muted)}
.expl{margin-top:12px;border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.expl .lbl{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.expl p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.7}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:500;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok.on{background:var(--ok);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.quiet{border-color:transparent;color:var(--muted)}
.btn.quiet.on{color:var(--ok)}
.btn.grow{flex:1}
.btn[disabled]{opacity:.5;cursor:default}
.kbd-hint{margin:14px 0 0}
@media (hover:none),(pointer:coarse){.kbd-hint{display:none}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:460px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;min-width:0}
.tile b{display:block;font-size:24px;line-height:1.1;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.stages{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line-soft);margin-top:10px}
.stages i{display:block;height:100%}
.stages .s3{background:var(--ok)}.stages .s2{background:var(--accent)}
h2{font-family:var(--font-display);font-size:19px;margin:6px 0 0;text-wrap:balance}
h3{font-size:14px;color:var(--muted);letter-spacing:.06em;margin:8px 0 0;font-weight:500}
details{min-width:0}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
summary::-webkit-details-marker{display:none}
summary h2{margin:0}
summary .small{flex:0 0 auto}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px;transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg);margin-bottom:-2px}
.units{display:grid;gap:6px}
.unit{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line-soft);border-radius:10px;background:var(--paper);min-width:0}
.unit .nm{min-width:0;font-size:15px;line-height:1.3}
.unit .nm small{display:block;color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);border:1px solid var(--line);flex:0 0 auto}
.dot.red{background:var(--bad);border-color:var(--bad)}
.dot.yellow{background:var(--warn);border-color:var(--warn)}
.dot.green{background:var(--ok);border-color:var(--ok)}
.mini{font-size:13px;padding:6px 10px;min-height:36px;border-radius:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:8px}
.strip i{display:block;aspect-ratio:1;border-radius:4px;background:var(--line-soft);border:1px solid var(--line-soft)}
.strip i.l1{background:var(--accent-soft);border-color:var(--accent-soft)}
.strip i.l2{background:var(--accent);border-color:var(--accent);opacity:.65}
.strip i.l3{background:var(--accent);border-color:var(--accent)}
.strip i.today{outline:2px solid var(--ink);outline-offset:1px}
.wrongs{display:grid;gap:8px}
.wrong{display:grid;gap:6px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:10px;background:var(--paper);min-width:0}
.wrong .stem-s{font-size:14px;line-height:1.5;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.wrong .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.field{display:grid;gap:4px;margin-top:10px}
.field label{font-size:14px}
.field input[type=number]{width:120px}
.field .hint,.hint{font-size:13px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.check input{width:18px;height:18px;margin:0}
.code{font-family:var(--font-mono);font-size:14px;letter-spacing:.04em;word-break:break-all;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);user-select:all;-webkit-user-select:all}
.notice{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);font-size:12px;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.empty{display:grid;gap:8px;text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{color:var(--ink);font-family:var(--font-display);font-size:20px}
.wronglist{display:grid;gap:6px;margin-top:10px}
.wronglist button{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--bad-soft);color:var(--ink);text-align:left;width:100%}
.wronglist button:hover{filter:brightness(.97)}
.wronglist small{color:var(--muted)}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="hdr">
    <div>
      <h1>會考每日練</h1>
      <div class="sub">數學 · 社會 · 遺忘曲線</div>
    </div>
    <div class="count" id="countdown"><b>…</b><span>距 116 年會考</span></div>
  </header>
  <main id="view">
    <section class="card empty"><b>載入題庫中</b><span>第一次打開要幾秒鐘。</span></section>
  </main>
</div>

<script>
/*@logic-start*/
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// Question text comes as plain lines. Space-aligned data rows become a real table, runs of 「名稱：內容」 lines
// become a label/value panel, and 【標題】 lines become headings; everything else is escaped text with line breaks.
var RT_SEP = /\s{2,}|\t|　+|\s*[|｜]\s*/, RT_KV = /^([^：:\s]{1,8})[：:]\s*(\S.*)$/, RT_H = /^【(.+)】$/, RT_NUM = /^[\d.,%°C−\-＋+~～\/]+$/;
function rtCells(l) { return l.trim().split(RT_SEP).filter(function (c) { return c !== ''; }); }
function rtIsRow(l) { return rtCells(l).length >= 3; }
function richText(text) {
  var lines = String(text == null ? '' : text).split('\n'), out = [], i = 0, m;
  while (i < lines.length) {
    var l = lines[i], t = l.trim();
    if (rtIsRow(l) && i + 1 < lines.length && rtIsRow(lines[i + 1])) {
      var rows = []; while (i < lines.length && rtIsRow(lines[i])) { rows.push(rtCells(lines[i])); i++; }
      var w = Math.max.apply(null, rows.map(function (r) { return r.length; }));
      out.push('<div class="rt-wrap"><table class="rt-table">' + rows.map(function (r, ri) {
        var tds = []; for (var c = 0; c < w; c++) { var v = r[c] == null ? '' : r[c]; var tag = ri === 0 ? 'th' : (c === 0 && !RT_NUM.test(v) ? 'th scope="row"' : 'td'); tds.push('<' + tag + '>' + esc(v) + '</' + tag.split(' ')[0] + '>'); }
        return '<tr>' + tds.join('') + '</tr>';
      }).join('') + '</table></div>');
      continue;
    }
    if ((m = RT_KV.exec(t)) && i + 1 < lines.length && RT_KV.test(lines[i + 1].trim())) {
      var kv = []; while (i < lines.length && (m = RT_KV.exec(lines[i].trim()))) { kv.push(m); i++; }
      out.push('<div class="rt-kv">' + kv.map(function (x) { return '<b>' + esc(x[1]) + '</b><span>' + esc(x[2]) + '</span>'; }).join('') + '</div>');
      continue;
    }
    if ((m = RT_H.exec(t))) { out.push('<div class="rt-h">' + esc(m[1]) + '</div>'); i++; continue; }
    out.push(esc(l) + '<br>'); i++;
  }
  return out.join('').replace(/(<br>)+$/, '').replace(/(<br>)+(<div class="rt-)/g, '$2').replace(/(<\/div>)(<br>)+/g, '$1');
}
// ---------- Spaced repetition (Leitner boxes on a forgetting-curve schedule) ----------
var EXAM_DATE = '2027-05-15';
var INTERVALS = [1, 3, 7, 14, 30];   // days until the next review after the 1st..4th correct answer; [4] is the check after 學會
var MASTER_BOX = 5;                  // correct on 5 separate days -> learned; then a 30-day check, then every 60 days
var MAINTAIN_DAYS = 60;
var DEFAULT_SETTINGS = { budget: 20, mathNew: 4, socialNew: 4, hardBias: false };
var WHY = { concept: '觀念不會', slip: '粗心或算錯', misread: '看錯題目' };
var MATH_META = {
  M01:[1,'整數的運算','A'],M02:[2,'分數的運算','A'],M03:[3,'一元一次方程式','B'],M04:[4,'二元一次聯立方程式','A'],
  M05:[5,'二元一次方程式的圖形','B'],M06:[6,'比與比例式','C'],M07:[7,'一元一次不等式','A'],M08:[8,'線對稱與三視圖','C'],

    html += '<details><summary><h2>社會 · ' + esc(area) + '</h2><span class="small muted num">' + seenN + ' / ' + list.length + ' 單元做過</span></summary><div class="units">' + list.map(function (u) { return unitRow(stats[u], stats[u].name); }).join('') + '</div></details>';
  });
  $view.innerHTML = html;
}
function renderSettings() {
  var st = S.settings, counts = { math: 0, social: 0 };
  S.bank.forEach(function (q) { counts[q.subject]++; });
  var html = '<section class="card"><h2>每天出幾題</h2>';
  html += '<div class="field"><label for="budget">每天最多幾題（複習 + 新題）</label><input type="number" id="budget" min="4" max="60" value="' + st.budget + '"><span class="hint">到期的複習題一定先出，剩下的名額才出新題。複習多的日子新題就自動變少，所以不會爆量。</span></div>';
  html += '<div class="field"><label for="mathNew">數學新題上限</label><input type="number" id="mathNew" min="0" max="10" value="' + st.mathNew + '"></div>';
  html += '<div class="field"><label for="socialNew">社會新題上限</label><input type="number" id="socialNew" min="0" max="10" value="' + st.socialNew + '"><span class="hint" id="newHint">沒有複習題的日子會出 數學 ' + st.mathNew + ' + 社會 ' + st.socialNew + ' = ' + (st.mathNew + st.socialNew) + ' 題新題。</span></div>';
  html += '<label class="check"><input type="checkbox" id="hardBias"' + (st.hardBias ? ' checked' : '') + '>難題出多一點</label>';
  html += '<div class="actions"><button class="btn primary" data-act="save-settings">儲存設定</button></div><p class="small muted" style="margin:10px 0 0">改了之後，明天的題組會照新設定出；今天已經排好的不變。</p></section>';
  html += '<section class="card"><h2>怎麼算「學會」</h2><p class="small" style="margin:8px 0 0">答對後這題會在 1、3、7、14 天後各再出一次，間隔越拉越長，剛好在快忘記的時候出現。連第一次共五次都答對就算學會，30 天後再確認一次，之後每兩個月再確認。答錯就回到起點，明天再出；答對後按「其實是猜的」也會回到起點。同一題一天只算一次，當天重做不會往上爬。答對兩次以後才會出現「我確定會了」，按了就直接算學會。</p>';
  html += '<p class="small muted" style="margin:8px 0 0">題庫：數學 ' + counts.math + ' 題、社會 ' + counts.social + ' 題，只有中等與難題。</p></section>';
  if (S.store.kind === 'remote' || (S.store.kind === 'local' && !IN_CLAUDE && S.syncCode)) {
    html += '<section class="card"><h2>換手機也能繼續</h2><p class="small" style="margin:8px 0 0">每台手機第一次打開都是一份新的空白紀錄。要在另一台手機看到同一份進度，用下面任一種方式接上。</p>';
    html += '<h3 style="margin-top:12px">方法一：傳連結給另一台手機</h3><p class="small muted" style="margin:4px 0 0">複製後用 LINE 傳給自己，在另一台手機點開就接上了。這個連結等於你的鑰匙，不要傳給別人。</p>';
    html += '<div class="actions"><button class="btn primary mini" data-act="copy-link">複製接上用的連結</button></div>';
    html += '<h3 style="margin-top:14px">方法二：用名稱和密碼</h3><p class="small muted" style="margin:4px 0 0">在每台手機都輸入同一組名稱和密碼，就會是同一份紀錄。記得住就好，不用很複雜。</p>';
    html += '<div class="field"><label for="loginName">名稱</label><input id="loginName" autocomplete="username" placeholder="例如 小明" style="width:100%"></div>';
    html += '<div class="field"><label for="loginPin">密碼</label><input id="loginPin" type="password" autocomplete="current-password" placeholder="至少 4 個字" style="width:100%"></div>';
    html += '<div class="actions"><button class="btn" data-act="login">用這組名稱和密碼</button></div>';
    html += '<details style="margin-top:12px"><summary><span class="small muted">進階：直接用同步碼</span></summary><div class="code" id="synccode" style="margin-top:6px">' + esc(S.syncCode) + '</div><div class="actions"><button class="btn mini" data-act="copy-code">複製同步碼</button></div>';
    html += '<div class="field"><label for="othercode">貼上另一台手機的同步碼</label><input id="othercode" inputmode="text" autocomplete="off" spellcheck="false" placeholder="32 個字" style="width:100%"></div><div class="actions"><button class="btn mini" data-act="use-code">切換到這組</button></div></details>';
    html += '<p class="small muted" style="margin:10px 0 0">狀態：' + (S.store.kind === 'remote' ? (S.offline ? '離線，使用上次同步的紀錄' : '已連上雲端') : '只存在這台裝置') + '。切換到別的紀錄後，這台原本的紀錄還在雲端，用原本的連結或同步碼可以切回來。</p></section>';
  } else {
    html += '<section class="card"><h2>紀錄存在哪裡</h2><p class="small muted" style="margin:8px 0 0">' + (S.store.kind === 'cloud' ? '存在雲端，用同一個 claude.ai 帳號在任何裝置打開都會同步。' : '只存在這個瀏覽器裡。清掉瀏覽器資料就會不見。') + '</p></section>';
  }
  html += '<section class="card"><h2>備份與清除</h2><div class="actions">';
  if (!IN_CLAUDE) html += '<button class="btn" data-act="export">下載紀錄備份（JSON）</button>';
  if (S.confirmReset) html += '<button class="btn danger" data-act="reset-yes">確定清除所有紀錄</button><button class="btn" data-act="reset-no">取消</button>';
  else html += '<button class="btn danger" data-act="reset">清除所有紀錄</button>';
  html += '</div><p class="small muted" style="margin:8px 0 0">清除會刪掉所有作答與學會的紀錄，設定和題庫不受影響。</p></section>';
  $view.innerHTML = html;
}

document.addEventListener('input', function (e) {
  if (e.target.id === 'mathNew' || e.target.id === 'socialNew') {
    var m = parseInt(document.getElementById('mathNew').value, 10) || 0, s = parseInt(document.getElementById('socialNew').value, 10) || 0, h = document.getElementById('newHint');
    if (h) h.textContent = '沒有複習題的日子會出 數學 ' + m + ' + 社會 ' + s + ' = ' + (m + s) + ' 題新題。';
  }
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act],[data-tab]'); if (!b || b.disabled) return;
  var act = b.dataset.act;
  if (!act && b.dataset.tab) { S.tab = b.dataset.tab; S.confirmReset = false; render(); window.scrollTo(0, 0); return; }
  if (act === 'tab') { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (act === 'answer') answer(+b.dataset.i);
  else if (act === 'next') { var ses = S.session, allDone = ses.ids.every(function (id) { return ses.answered[id]; }); ses.idx = allDone ? ses.ids.length : ses.idx + 1; render(); window.scrollTo(0, 0); }
  else if (act === 'prev') { if (S.session.idx > 0) S.session.idx--; render(); window.scrollTo(0, 0); }
  else if (act === 'goto') { S.session.idx = Math.max(0, Math.min(S.session.ids.length - 1, +b.dataset.idx)); render(); window.scrollTo(0, 0); }
  else if (act === 'master') toggleMastered(b.dataset.id);
  else if (act === 'guess') guessed(b.dataset.id);
  else if (act === 'why') setWhy(b.dataset.id, b.dataset.why);
  else if (act === 'more') addMore(+b.dataset.n);
  else if (act === 'unit') startUnit(b.dataset.unit);
  else if (act === 'wrong-filter') { S.wrongFilter = b.dataset.f; render(); }
  else if (act === 'redo-wrong') startWrong(wrongList(S.bank, S.cards).filter(function (q) { return S.wrongFilter === 'all' || q.subject === S.wrongFilter; }).map(function (q) { return q.id; }));
  else if (act === 'redo-one') startWrong([b.dataset.id]);
  else if (act === 'back-daily') { ensureDaily(); render(); window.scrollTo(0, 0); }
  else if (act === 'reload') location.reload();
  else if (act === 'save-settings') {
    var v = function (id, lo, hi) { var n = parseInt(document.getElementById(id).value, 10); return isNaN(n) ? lo : Math.max(lo, Math.min(hi, n)); };
    S.settings = normalizeSettings({ budget: v('budget', 4, 60), mathNew: v('mathNew', 0, 10), socialNew: v('socialNew', 0, 10), hardBias: document.getElementById('hardBias').checked });
    S.store.setSettings(S.settings).then(function () { toast('設定已儲存，明天開始生效。'); }).catch(saveErr);
    render();
  }
  else if (act === 'copy-link') {
    var link = joinLink(S.syncCode || '');
    var fb = function () { toast('複製不了，改用下面的同步碼。'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(function () { toast('連結已複製，傳到另一台手機點開就接上。'); }, fb); else fb();
  }
  else if (act === 'login') {
    var nm = (document.getElementById('loginName').value || '').trim(), pin = document.getElementById('loginPin').value || '';
    if (nm.length < 1 || pin.length < 4) { toast('名稱要填，密碼至少 4 個字。'); return; }
    codeFromLogin(nm, pin).then(function (code) {
      try { localStorage.setItem(CODE_KEY, code); localStorage.removeItem(LS_KEY); } catch (err) {}
      location.reload();
    });
  }
  else if (act === 'copy-code') {
    var code = S.syncCode || '';
    var fallback = function () { var el = document.getElementById('synccode'); if (el) { var r = document.createRange(); r.selectNodeContents(el); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast('已選取，長按複製。'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(function () { toast('同步碼已複製。'); }, fallback); else fallback();
  }
  else if (act === 'use-code') {
    var input = (document.getElementById('othercode').value || '').trim().toLowerCase();
    if (!/^[0-9a-f]{32}$/.test(input)) { toast('同步碼要是 32 個字的英數字。'); return; }
    try { localStorage.setItem(CODE_KEY, input); localStorage.removeItem(LS_KEY); } catch (err) {}
    location.reload();
  }
  else if (act === 'export') {
    var blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), cards: S.cards, days: S.days, settings: S.settings }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'huikao-daily-' + S.today + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }
  else if (act === 'reset') { S.confirmReset = true; render(); }
  else if (act === 'reset-no') { S.confirmReset = false; render(); }
  else if (act === 'reset-yes') {
    S.confirmReset = false;
    S.store.reset().then(function () { S.cards = {}; S.days = {}; S.session = null; ensureDaily(); toast('紀錄已清除。'); S.tab = 'today'; render(); })
      .catch(function (err) { if (window.console) console.warn(err); toast('清除沒有完成，請重新載入後再試一次。'); });
  }
});
document.addEventListener('keydown', function (e) {
  if (S.tab !== 'today' || !S.session || e.metaKey || e.ctrlKey || e.altKey) return;
  var el = document.activeElement;
  if (el && el !== document.body && /^(INPUT|SELECT|TEXTAREA|BUTTON|A|SUMMARY)$/.test(el.tagName)) return;   // let focused controls work
  var ses = S.session, id = ses.ids[ses.idx]; if (!id) return;
  var k = e.key.toUpperCase(), ord = ses.order[id] || [0, 1, 2, 3];
  if (!ses.answered[id] && /^[1-4]$/.test(k)) answer(ord[+k - 1]);
  else if (!ses.answered[id] && /^[A-D]$/.test(k)) answer(ord['ABCD'.indexOf(k)]);
  else if (ses.answered[id] && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ses.idx++; render(); window.scrollTo(0, 0); }
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.ready && rollover()) render();
});

function pickStore() {
  if (!IN_CLAUDE && joinFromHash()) { /* code swapped in; the record is loaded below with it */ }
  if (IN_CLAUDE) {
    return Promise.resolve().then(function () { return window.claude.use('db'); }).catch(function () { return null; })
      .then(function (db) { return db ? dbStore(db) : localStore(); });
  }
  var selfHosted = location.protocol === 'https:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (selfHosted || /[?&]sync=1/.test(location.search)) { S.syncCode = syncCode(); return Promise.resolve(remoteStore(API_BASE, S.syncCode)); }
  return Promise.resolve(localStore());
}
function boot(hot) {
  S.tab = (hot && hot.tab) || ({ '#wrong': 'wrong', '#progress': 'progress', '#settings': 'settings' }[location.hash] || 'today');
  renderCountdown(); renderTabs();
  var bankP = fetch('questions.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  Promise.all([bankP, pickStore()]).then(function (r) {
    var data = r[0]; S.bank = Array.isArray(data) ? data : (data.questions || []);
    S.byId = {}; S.bank.forEach(function (q) { S.byId[q.id] = q; });
    S.store = r[1];
    return S.store.load().catch(function (e) {
      if (window.console) console.warn(e);
      if (S.store.kind === 'remote') { S.offline = true; return localStore().load(); }   // last mirrored record
      // the cloud record could not be read: starting from nothing would overwrite it, so stop here instead
      throw { title: '讀不到你的紀錄', text: '雲端暫時連不上。為了不蓋掉你的進度，先不開始；請稍後重新載入。' };
    });
  }).then(function (st) {
    S.cards = st.cards || {}; S.days = st.days || {};
    S.settings = normalizeSettings(st.settings);
    S.ready = true; ensureDaily();
    if (hot && hot.idx != null && S.session && hot.idx <= S.session.ids.length) S.session.idx = hot.idx;
    render();
  }).catch(function (e) { S.error = e && e.title ? e : { title: '題庫載入失敗', text: e && e.message ? e.message : String(e) }; render(); });
}
if (!IN_CLAUDE) {
  try {
    var mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = 'manifest.webmanifest'; document.head.appendChild(mf);
    var tc = document.createElement('meta'); tc.name = 'theme-color'; tc.content = '#2C58B4'; document.head.appendChild(tc);
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  } catch (e) {}
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { tab: S.tab, idx: S.session ? S.session.idx : null }; });
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
