<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生殖錯題講解</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: one 680px reading column drawn like a squared workbook (方格紙): sticky header with the chapter name
   and overall progress, a strip of section chips, then the section itself. Each 考卷錯題 card shows the student's
   own pick in red pen and the right answer in green pen, the same marks as 會考每日練. In the chromosome demo,
   blue is a chromosome from the father and yellow one from the mother. */
:root{
  --bg:#F1F3F6; --paper:#FFFFFF; --ink:#1B2430; --muted:#5F6B7D; --line:#D5DBE5; --line-soft:#E7EBF1;
  --accent:#2C58B4; --accent-ink:#FFFFFF; --accent-soft:#E4ECFA;
  --hl:#C98A00; --hl-soft:#FBF0D6;
  --ok:#15744A; --ok-soft:#E1F3E9; --bad:#B0321F; --bad-soft:#FBE6E2;
  --grid:rgba(44,88,180,.07); --shadow:0 1px 2px rgba(27,36,48,.06),0 8px 24px rgba(27,36,48,.06);
  --font-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161F; --paper:#1A2130; --ink:#E9EDF3; --muted:#9BA6B9; --line:#2D3748; --line-soft:#232C3B;
    --accent:#8AADF2; --accent-ink:#0E1626; --accent-soft:#243655;
    --hl:#E3B55B; --hl-soft:#3A2D14;
    --ok:#5CD095; --ok-soft:#17311F; --bad:#F39183; --bad-soft:#3B201B;
    --grid:rgba(138,173,242,.09); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161F; --paper:#1A2130; --ink:#E9EDF3; --muted:#9BA6B9; --line:#2D3748; --line-soft:#232C3B;
  --accent:#8AADF2; --accent-ink:#0E1626; --accent-soft:#243655;
  --hl:#E3B55B; --hl-soft:#3A2D14;
  --ok:#5CD095; --ok-soft:#17311F; --bad:#F39183; --bad-soft:#3B201B;
  --grid:rgba(138,173,242,.09); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(48px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;min-width:0}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line-soft);display:grid;gap:6px}
.hdr .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-width:0}
.hdr h1{font-family:var(--font-display);font-size:24px;line-height:1.15;margin:0;letter-spacing:.02em}
.hdr h1 a{color:inherit;text-decoration:none}
.hdr .sub{font-size:12px;color:var(--muted);letter-spacing:.06em}
.hdr .done{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hdr .done b{font-family:var(--font-display);font-size:20px;color:var(--ink)}
.bar{height:5px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.strip{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:13px;line-height:1;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);text-decoration:none;white-space:nowrap}
.strip a.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.strip a.ok:not(.on){color:var(--ok);border-color:var(--ok)}
main{padding-block:16px;display:grid;gap:14px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.sheet{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:500;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.mini{min-height:34px;padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:default}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.tag.hl{background:var(--hl-soft);color:var(--hl)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
/* rich text */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.2;margin:0 .15em;font-size:.95em}
.fr>span{padding:0 .15em}
.fr>span+span{border-top:1.5px solid currentColor}
b,strong{font-weight:700}
/* home */
.hero h2{font-family:var(--font-display);font-size:26px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0 0 12px}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.toc a{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);text-decoration:none;color:var(--ink);min-width:0}
.toc .n{font-family:var(--font-display);font-size:18px;color:var(--accent);text-align:center;line-height:1}
.toc .t{min-width:0}
.toc .t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.toc .st{font-size:13px;font-weight:700;white-space:nowrap}
.toc .st.ok{color:var(--ok)}
.toc .st.go{color:var(--hl)}
/* section */
.sec{display:grid;gap:14px;min-width:0}
.sec-h .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.sec-h h2{font-family:var(--font-display);font-size:24px;line-height:1.3;margin:2px 0 4px;text-wrap:balance}
.lp{margin:0;font-size:17px;line-height:1.85;text-wrap:pretty;word-break:break-word}
.key{border:1.5px solid var(--accent);border-radius:12px;background:var(--accent-soft);padding:12px 14px;min-width:0}
.key .kt{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent);margin-bottom:4px}
.key ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.key li{font-size:17px;line-height:1.75;word-break:break-word}
.ex{display:grid;gap:8px}
.ex .stem,.chk .stem{font-size:17px;line-height:1.8;word-break:break-word;margin:0;text-wrap:pretty}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:st}
.steps li{position:relative;padding:8px 10px 8px 40px;border-radius:10px;background:var(--bg);font-size:16px;line-height:1.75;word-break:break-word;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;line-height:1}
.final{padding:10px 12px;border-radius:10px;border:1.5px solid var(--ok);background:var(--ok-soft);font-weight:700;color:var(--ok)}
.trap{display:grid;gap:6px;padding:12px 14px;border-radius:12px;border:1.5px dashed var(--bad);background:var(--paper)}
.trap .w{color:var(--bad);word-break:break-word}
.trap .w b,.trap .r b{font-family:var(--font-display);margin-right:4px}
.trap .r{color:var(--ok);word-break:break-word}
.trap .why{font-size:15px;color:var(--muted);word-break:break-word}
details.why{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0 14px}
details.why summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--accent);list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"＋ "}
details.why[open] summary::before{content:"－ "}
details.why .body{display:grid;gap:8px;padding-bottom:14px}
details.why p,details.why .pl{margin:0;line-height:1.8;word-break:break-word}
.opts{display:grid;gap:8px;margin-top:4px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:16px;line-height:1.6;min-height:48px}
.opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.opt .v{min-width:0;word-break:break-word}
.opt:not([disabled]):hover{border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{padding:10px 12px;border-radius:10px;font-size:15px;line-height:1.75;word-break:break-word}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.hint{background:var(--hl-soft);color:var(--ink)}
.fb.hint b{color:var(--hl)}
.sol{display:grid;gap:4px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.sol p{margin:0;line-height:1.8;word-break:break-word}
.chk{display:grid;gap:10px}
.pn{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
/* demos */
.demo{display:grid;gap:10px}
.demo .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo input[type=range]{flex:1;min-width:160px;accent-color:var(--accent);height:32px}
.demo .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.demo .seg button{padding:7px 12px;font-size:14px;min-height:36px}
.demo .seg button.on{background:var(--accent);color:var(--accent-ink)}
.rt{display:grid;gap:6px}
.rt .r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums;font-size:15px}
.rt .r .eq{font-weight:700;white-space:nowrap}
.rt .r.ok .eq{color:var(--ok)}
.rt .r.bad .eq{color:var(--bad)}
.rt .r .x{min-width:0;word-break:break-word}
.demo svg{display:block;width:100%;height:auto}
.demo .cap{font-size:15px;line-height:1.75;padding:10px 12px;border-radius:10px;background:var(--bg);word-break:break-word}
.demo .nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.demo .ctl{flex-direction:column;align-items:flex-start;gap:4px}
.demo .lbl{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.demo .seg button{padding:7px 11px}
.demo .rt .r{grid-template-columns:auto 1fr}
.demo .rt .r .eq{white-space:normal;text-align:right}
.cm-cell{fill:var(--paper);stroke:var(--muted);stroke-width:1.4}
.cm-egg{fill:var(--hl-soft);stroke:var(--hl);stroke-width:1.4}
.cm-sp{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.cm-tail{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round}
.cm-d{fill:#3E74D6}.cm-m{fill:#E0A21B}
.cm-cen{fill:var(--paper);stroke:var(--ink);stroke-width:.8}
.cm-t{fill:var(--ink);font-size:12px;font-family:var(--font-body);font-weight:700}
.cm-s{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.cm-arrow{stroke:var(--muted);stroke-width:1.4;fill:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:18px;border-radius:4px;vertical-align:middle;margin-right:5px}
/* tables inside question text */
.tbw{overflow-x:auto;margin:4px 0;max-width:100%}
table.tb{border-collapse:collapse;font-size:15px;line-height:1.5;min-width:100%}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;word-break:normal;overflow-wrap:break-word}
table.tb th{background:var(--bg);font-weight:700}
/* 考卷錯題 */
.mis{display:grid;gap:10px;border-left:4px solid var(--bad)}
.mis.okd{border-left-color:var(--ok)}
.mis .opt{cursor:default}
.mis .mk{flex:0 0 auto;margin-left:auto;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.mis .opt.ok .mk{background:var(--ok);color:var(--paper)}
.mis .opt.bad .mk{background:var(--bad);color:var(--paper)}
.mis .sum{font-size:15px}
.mis .kt{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.ow{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.ow li{display:flex;gap:8px;line-height:1.75;word-break:break-word}
.ow li b{flex:0 0 auto}
.ow li.ok b{color:var(--ok)}.ow li.bad b{color:var(--bad)}
.photo{margin:0;display:grid;gap:4px;justify-items:center}
.photo img{display:block;max-width:min(100%,300px);height:auto;border-radius:10px;border:1px solid var(--line)}
.photo figcaption{font-size:13px;color:var(--muted);text-align:center}
.rem{border:1.5px solid var(--hl);border-radius:12px;background:var(--hl-soft);padding:10px 14px}
.rem .kt{color:var(--hl)}
.key .tbw{margin:6px 0;background:var(--paper);border-radius:8px}
.rem p{margin:2px 0 0;font-size:17px;line-height:1.75;font-weight:500;word-break:break-word}
.score{font-family:var(--font-display);font-size:44px;line-height:1;color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="wrap">
  <header class="hdr">
    <div class="top">
      <div><h1><a href="#">生殖：把錯題弄懂</a></h1><div class="sub">自然・生物第 6 單元・第 7 回複習考</div></div>
      <div class="done"><b id="doneN">0</b> / <span id="doneT">5</span> 節完成</div>
    </div>
    <div class="bar" aria-hidden="true"><i id="doneBar" style="width:0%"></i></div>
    <nav class="strip" id="strip" aria-label="節次"></nav>
  </header>
  <main id="view"></main>
</div>
<script type="application/json" id="lesson-data">{"sections":[{"id":"g1","title":"染色體怎麼算：「對」和「條」","blocks":[{"type":"p","text":"54 分不代表你很爛，只代表有幾個地方還沒接起來。這次錯的 16 題裡，有 6 題都卡在同一件事：染色體怎麼算。把這一節弄懂，這 6 題就能一起解決。"},{"type":"p","text":"先想像一個細胞，中間有一個細胞核。細胞核裡有**染色體**：帶著遺傳資料（基因）的構造。這些染色體不是亂放的，而是一對一對排好。"},{"type":"p","text":"每一對叫做**同源染色體**：一條來自爸爸、一條來自媽媽，大小形狀一樣的一對染色體（男生的性染色體 X、Y 是例外，大小形狀不同，之後遺傳單元會再學）。人身上一般的細胞（例如皮膚細胞，下面會叫它體細胞）有 23 對染色體。23 對就是 23×2＝46 條。"},{"type":"p","text":"「對」和「條」一定要分清楚。1 對＝2 條，就像 1 雙鞋子＝2 隻鞋子。題目寫「對」還是「條」，每次都要先圈起來。"},{"type":"p","text":"從爸爸來的那 23 條叫「一套」，從媽媽來的那 23 條是另一套。一套就是：每一對裡各拿一條。**n** 是一個數字，代表「一套有幾條」，人的一套有 23 條，所以人的 n＝23。"},{"type":"p","text":"**體細胞**：身體裡一般的細胞，例如皮膚細胞、肌肉細胞、葉肉細胞。體細胞有爸爸一套＋媽媽一套＝兩套，寫成 **2n**。人的體細胞：2n＝2×23＝46 條，也就是 23 對，成對。"},{"type":"p","text":"生殖細胞叫**配子**：動物是精子和卵，植物是精細胞和卵細胞（精細胞就是精子，卵細胞就是卵，題目兩種說法都會用）。配子只拿到每一對中的一條（它是怎麼做出來的，下面講減數分裂時會說），所以只有一套、不成對，記成 **n**。人的精子和卵：n＝23 條，不成對。"},{"type":"p","text":"題目問「套數」，就是在問有幾套。體細胞是 2 套，寫成 2n。精子和卵是 1 套，寫成 n。"},{"type":"key","title":"對、條、2n、n","lines":["1 對＝2 條（像 1 雙鞋＝2 隻鞋）","條數＝對數×2","對數＝條數÷2（只有體細胞可以這樣算！精子和卵每一對只有一條，不能除以 2 湊成對）","體細胞：兩套，成對，叫 2n（人：2n＝46 條＝23 對）","精子、卵（配子）：一套，每對只有一條，不成對，叫 n（人：n＝23 條）"]},{"type":"p","text":"「成對」的意思是：有同一款的兩條，一條爸爸的、一條媽媽的。精子的染色體，就像從 10 雙不同的鞋子各拿一隻。這 10 隻都是不同款，湊不成任何一雙，所以叫「不成對」。"},{"type":"p","text":"細胞有兩種分裂方式：**細胞分裂**（讓細胞變多，用來生長、修補）和**減數分裂**（用來製造精子和卵）。分裂後產生的新細胞叫**子細胞**。"},{"type":"p","text":"細胞分裂前，染色體會先複製一份，就像把一本筆記影印一份。例如人的細胞原本 46 條，複製後暫時有 2 份。"},{"type":"p","text":"接著兩份被拉開，這就叫「**複製的染色體互相分離**」。2 份分給 2 個子細胞，每個各拿 1 份，所以又是 46 條。先變兩倍，再對半分，結果和原來一樣，不是加倍。"},{"type":"key","title":"三條規則","lines":["**細胞分裂**：1 個細胞變 2 個，每個子細胞的染色體數目和原來一樣。","細胞分裂用在：長大、傷口修補、變形蟲這種單細胞生物產生新個體（不用精子和卵的生殖，叫**無性生殖**）。","**減數分裂**（製造精子和卵）：1 個細胞最後變成 4 個，每個子細胞的染色體數目減半，而且不成對。","為什麼是 4 個？減數分裂是染色體複製一次，但細胞連續分兩次：1→2→4。複製一次只多出 1 份，卻要分給 4 個細胞，所以每個只拿到一半（n）。","**受精**：精子（n）＋卵（n）＝受精卵（2n），和親代（爸爸媽媽那一代）一樣。","受精卵＝精子和卵合在一起變成的第一個細胞，之後會長成新的個體（例如寶寶）。","細胞分裂和減數分裂都有「複製的染色體互相分離」這一步。"]},{"type":"p","text":"下面的小工具可以自己動手看。先選一種生物，再按「細胞分裂」，看 1 個細胞怎麼變成 2 個。"},{"type":"demo","name":"chromo","mode":"cell"},{"type":"p","text":"看完後換按「減數分裂」和「受精」。每按一次，都看一下畫面上的「幾對、幾條、2n 或 n」怎麼變。"},{"type":"key","title":"細胞分裂和減數分裂比一比","lines":["項目｜細胞分裂｜減數分裂","發生在哪裡｜身體大部分的細胞（皮膚、肌肉、葉肉等）｜生殖器官（例如人的睪丸、卵巢）","子細胞數｜2 個｜4 個","子細胞染色體數目｜和原來一樣（2n）｜減半（n）","成不成對｜成對｜不成對","複製的染色體互相分離｜有｜有","用途｜生長、傷口修補、變形蟲等的生殖｜產生精子和卵"]},{"type":"why","title":"想知道為什麼？","lines":["為什麼分裂前要先複製？因為每個子細胞都需要一整份遺傳資料。先複製一份，分離後兩邊才都拿得到。","為什麼精子和卵要減半？因為受精時精子和卵會合在一起，兩個加起來要剛好等於爸爸媽媽的數目：23＋23＝46。","如果不減半，人的受精卵就會是 46＋46＝92 條，下一代再變 184 條，越來越多。","為什麼精子和卵不成對？因為減數分裂時，每一對同源染色體會分開，各去不同的細胞，所以每個細胞每對只拿到一條。"]},{"type":"trap","wrong":"題目說體細胞有 10 對染色體，就直接拿 10 當條數來算。","right":"先換成條數：10 對＝10×2＝20 條。精子、卵才是 10 條（不成對）。","reason":"「對」和「條」差了 2 倍。只要沒換算，後面每一步都會跟著錯。"},{"type":"trap","wrong":"細胞分裂變 4 個、數目減半；減數分裂變 2 個、數目不變。","right":"細胞分裂：2 個，數目一樣。減數分裂：4 個，數目減半。","reason":"記法：「減數」分裂，名字裡就有「減」，所以數目減半的是它。它負責做精子和卵。"},{"type":"trap","wrong":"受精是兩個細胞合在一起，所以受精卵的染色體是親代的兩倍。","right":"受精卵的染色體數目和親代一樣。","reason":"精子和卵都已經先減半成 n 了。n＋n＝2n，剛好補回親代的數目，不會變兩倍。"},{"type":"example","id":"g1e1","stem":"某生物的體細胞有 8 對染色體。請問：(1) 皮膚細胞有幾條？(2) 精子有幾條？(3) 受精卵有幾條？","steps":["先換算：8 對＝8×2＝16 條。","皮膚細胞是體細胞，染色體成對（2n），所以是 16 條。","精子由減數分裂產生，每對只留一條：8 對各留 1 條，共 8 條，不成對（n）。","卵也是 n，同樣是 8 條。","受精卵＝精子 8 條＋卵 8 條＝16 條，又變回 8 對（2n）。"],"final":"皮膚細胞 16 條；精子 8 條（不成對）；受精卵 16 條（8 對）"},{"type":"example","id":"g1e2","stem":"一個細胞有 3 對染色體，連續進行細胞分裂 2 次。請問：共有幾個細胞？每個細胞有幾條染色體？","steps":["先換算：3 對＝3×2＝6 條。","細胞分裂 1 次：1 個變 2 個。","細胞分裂 2 次：2 個各再變 2 個，2×2＝4 個。","細胞分裂後，每個子細胞的染色體數目和原來一樣。","所以每個細胞都還是 3 對，也就是 6 條。"],"final":"共 4 個細胞，每個 6 條（3 對）"},{"type":"mistake","id":"g1m25","qno":25,"stem":"同一生物卵細胞與精細胞內的染色體套數分別為何？","options":["n；n","n；2n","2n；n","2n；2n"],"answer":0,"yours":[1],"think":["這題問卵細胞和精細胞的「套數」。先翻譯題目：「精細胞」就是精子，「卵細胞」就是卵，兩個都是配子。","「套數」就是在問有幾套染色體。","一套＝每一對裡拿一條，人的一套有 23 條。","體細胞有爸爸給的一套＋媽媽給的一套＝2 套，寫成 2n；精子和卵只有 1 套，寫成 n。","卵和精子都是減數分裂產生的，每一對只留一條，所以兩個都是 n。","答案是 (A) n；n。"],"optionWhy":["正確。卵和精子都是減數分裂做出來的，每對只有一條，都是 1 套，都是 n。","你可能看到「套數」不確定在問什麼，就猜精子比較特別、和卵不一樣。其實卵和精子都是減數分裂做出來的，都只有 1 套，都是 n。","選這個可能是覺得卵比較大，染色體就比較多；但細胞大小和染色體數目沒有關係，卵也是 n。","選這個是把生殖細胞當成體細胞了；2 套、成對的 2n 是體細胞，精子和卵是 n。"],"remember":"精子和卵都是減數分裂產生的，只有 1 套，所以兩個都是 n；受精卵和體細胞才是 2 套（2n）。"},{"type":"mistake","id":"g1m27","qno":27,"stem":"某生物的體細胞含有 10 對染色體，則該生物經過減數分裂所產生的生殖細胞中，含有的染色體數目應為多少？","options":["10 對","2 對","10 條且不成對","10 條且成對"],"answer":2,"yours":[3],"think":["這題問減數分裂後生殖細胞的染色體，選項同時考「幾條」和「成不成對」。","先換算：體細胞 10 對＝10×2＝20 條，成對（2n）。","減數分裂時，每一對只留一條給生殖細胞：10 對各留 1 條，共 10 條。","這 10 條分別來自 10 個不同的對，每一條都是不同款，湊不成任何一對，所以不成對（n）。","答案是 (C) 10 條且不成對。"],"optionWhy":["選這個通常是以為生殖細胞和體細胞一樣；10 對是體細胞的數目，減數分裂後會減半。","2 對在題目裡算不出來，可能是用猜的。減數分裂是減半，不是減到剩很少：10 對＝20 條，減半是 10 條，而且不成對，所以也不能寫成「幾對」。","正確。20 條減半成 10 條，每對只留一條，所以不成對。","你算對了 10 條，這一步很好！只差一點：「成對」不是指能不能兩條兩條數，而是有沒有「同一款的兩條」（一條爸爸的、一條媽媽的）。減數分裂後，10 對裡每一對只留下一條，這 10 條每一條都是不同款，就像 10 雙不同的鞋子各拿一隻，湊不成任何一雙，所以是「10 條且不成對」（「對數＝條數÷2」只能用在體細胞）。"],"remember":"減數分裂後：條數＝原來的對數，而且一定不成對（每一條都來自不同的一對）。"},{"type":"mistake","id":"g1m9","qno":9,"stem":"某株植物葉肉細胞的核內染色體數目為 8 對，若該植物因照射 X 光產生突變，使個體產生配子時是進行細胞分裂，則其配子染色體數目應為多少？","options":["4 條","8 條","16 條","32 條"],"answer":2,"yours":[3],"think":["這題問配子的染色體數目。關鍵詞有兩個：「8 對」和「產生配子時是進行細胞分裂」。","X 光、突變只是題目的故事，用來解釋這株植物為什麼不用減數分裂。突變不會讓你另外再乘 2，重點只看後半句「產生配子時是進行細胞分裂」。","葉肉細胞是體細胞，8 對＝8×2＝16 條。","正常情況下，配子是減數分裂產生的，會減半；但這株植物是用細胞分裂產生配子。","細胞分裂後，子細胞的染色體數目和原來一樣，所以配子也是 16 條。","答案是 (C) 16 條。"],"optionWhy":["選這個可能是把 8 對當成 8 條，又用了減數分裂的減半，8÷2＝4；兩個地方都要再看一次。","8 條是「正常」減數分裂的結果；但題目說這株植物是用細胞分裂產生配子，數目不會減半。","正確。8 對＝16 條，細胞分裂後數目不變，配子也是 16 條。","你可能先算出 16 條，又多乘了一次 2。如果你是看到「突變」就以為要加倍，這裡不用：突變只是讓它改用細胞分裂，而細胞分裂不會讓染色體加倍，配子和原來一樣是 16 條。"],"remember":"先看題目說用哪一種分裂：細胞分裂數目不變，減數分裂數目減半；題目裡的故事（像突變）不用另外加倍。"},{"type":"mistake","id":"g1m24","qno":24,"stem":"生物行有性生殖時，精子和卵結合的主要作用，下列敘述何者正確？","options":["使受精卵的染色體數目為親代染色體數目的兩倍","使受精卵的染色體數目為親代染色體數目的一半","使受精卵的染色體數目等於親代的染色體數目","使受精卵具有兩個細胞核"],"answer":2,"yours":[1],"think":["這題問受精（精子和卵結合）對染色體數目有什麼作用。","親代的體細胞是 2n。","親代用減數分裂做出精子和卵，數目都減半成 n。","受精時精子和卵結合：n＋n＝2n。","受精卵是 2n，和親代一樣，答案是 (C)。"],"optionWhy":["選這個通常是以為兩個細胞合在一起就變兩倍；但精子和卵已經先減半了，合起來剛好補回原來的數目。","你可能把受精和減數分裂搞混了。減半的是製造精子和卵的減數分裂；受精是把兩個一半合起來，變回完整的數目。","正確。精子 n＋卵 n＝受精卵 2n，和親代一樣。","受精時精子的細胞核和卵的細胞核會合成一個，所以受精卵只有一個細胞核。"],"remember":"減數分裂減半，受精補回來：n＋n＝2n，和親代一樣。"},{"type":"mistake","id":"g1m10","qno":10,"stem":"若有一個細胞內含染色體 4 對，經過三次細胞分裂可產生 X 個細胞，每個細胞有 Y 條染色體，則 X－Y 的結果為何？","options":["16","8","4","0"],"answer":3,"yours":[1],"think":["這題要分別算出細胞數 X 和每個細胞的條數 Y，再相減；要注意題目給的是「4 對」。","細胞分裂一次，1 個變 2 個：1→2→4→8，分裂三次後 X＝8。","細胞分裂後染色體數目不變，每個細胞仍是 4 對。","4 對＝4×2＝8 條，所以 Y＝8。","X－Y＝8－8＝0，答案是 (D)。"],"optionWhy":["選這個可能是把 X 和 Y 加起來了（8＋8＝16）；題目要的是 X－Y。","你可能算出 X＝8 就選了，忘了題目要的是 X－Y，還要再減掉 Y＝8；也可能是數細胞多數了一次（1→2→4→8→16），算成 16－8＝8。分裂三次是 1→2→4→8，所以 X＝8。","選這個是把 4 對當成 4 條，算成 Y＝4，8－4＝4；4 對要換成 8 條。","正確。X＝8 個細胞，Y＝8 條，8－8＝0。"],"remember":"分裂幾次，就從 1 開始乘幾次 2：1 次→2 個，2 次→4 個，3 次→8 個。每個細胞的染色體數目都不變。"},{"type":"mistake","id":"g1m30","qno":30,"stem":"下表是單一細胞進行細胞分裂和減數分裂的比較，試問何者正確？\n項目｜細胞分裂｜減數分裂\n(A) 複製的染色體互相分離｜有｜有\n(B) 子細胞的數目｜4 個｜2 個\n(C) 子細胞染色體的數目｜加倍｜減半\n(D) 分裂的結果｜可使人類產生精子和卵｜可使變形蟲產生新個體","options":["見表 (A) 列","見表 (B) 列","見表 (C) 列","見表 (D) 列"],"answer":0,"yours":[2],"think":["這題要找比較表中正確的一列，所以一列一列拿規則來對照。","(A) 列：兩種分裂前都會先複製染色體，分裂時複製的染色體都會互相分離，「有／有」是對的。","(B) 列：細胞分裂產生 2 個子細胞，減數分裂產生 4 個，表上寫反了。","(C) 列：細胞分裂前雖然先複製，但複製完會平分給 2 個子細胞，數目和原來一樣，不是加倍。","(D) 列：產生精子和卵的是減數分裂，變形蟲產生新個體靠的是細胞分裂，也寫反了。","答案是 (A)。"],"optionWhy":["正確。細胞分裂和減數分裂都有「複製的染色體互相分離」這一步。","選這個是把兩種分裂的子細胞數記反了；細胞分裂 2 個，減數分裂 4 個。","你記得減數分裂是減半，這部分是對的！細胞分裂容易被誤以為加倍，是因為分裂前染色體先複製了一份。可是複製完會平分給 2 個子細胞：46 條→複製成 2 份→每個子細胞拿 1 份＝46 條。先變兩倍，再對半分，結果和原來一樣。","選這個是把兩種分裂的用途對調了；精子和卵靠減數分裂，變形蟲靠細胞分裂。"],"remember":"細胞分裂：2 個、一樣多；減數分裂：4 個、減半；兩者都有「複製的染色體互相分離」。"},{"type":"check","id":"g1c1","skill":"從體細胞的「對」數，算出精子或卵有幾條、成不成對。","variants":[{"stem":"果蠅的體細胞有 4 對染色體。果蠅的精子有幾條染色體？成不成對？","options":["4 條，不成對","4 條，成對","8 條，成對","2 條，不成對"],"answer":0,"why":["正確。4 對＝8 條，減數分裂減半成 4 條，每對只留一條，所以不成對。","選這個通常是條數算對了，但以為 4 條可以兩兩一對；「成對」要有同一款的兩條，精子的 4 條是從 4 對裡各拿一條，就像 4 雙不同的鞋各拿一隻，湊不成一雙。","選這個通常是以為精子和體細胞一樣；8 條成對是體細胞的狀況。","選這個通常是把 4 對當成 4 條再減半；要先把 4 對換成 8 條。"],"hints":["精子是減數分裂做出來的，先把「對」換成「條」，再想減數分裂會怎樣。","體細胞 4 對＝8 條；減數分裂時每對只留一條，精子有幾條？每一條都來自不同的一對，它們還能湊成一雙嗎？"],"solution":["體細胞 4 對＝4×2＝8 條，成對（2n）。","精子由減數分裂產生，每對只留一條。","4 對各留 1 條，共 4 條。","這 4 條各來自不同的一對，都是不同款，所以不成對（n）。","答案：4 條，不成對。"],"id":"g1c1v1"},{"stem":"豌豆的體細胞有 7 對染色體。豌豆的卵細胞有幾條染色體？成不成對？","options":["7 條，成對","14 條，成對","7 條，不成對","14 條，不成對"],"answer":2,"why":["選這個通常是條數算對了，但以為 7 條可以湊成對；卵細胞的 7 條是從 7 對裡各拿一條，每條都不同款，所以不成對。","選這個通常是把卵細胞當成體細胞；14 條成對是體細胞的狀況。","正確。7 對＝14 條，減數分裂減半成 7 條，每對只留一條，不成對。","選這個通常是記得卵不成對，但忘了減數分裂會減半；14 條要減半成 7 條。"],"hints":["卵細胞是減數分裂做出來的，要同時想「幾條」和「成不成對」。","體細胞 7 對＝14 條；每對只留一條給卵細胞，條數會變成多少？這些條數還有同一款的兩條嗎？"],"solution":["體細胞 7 對＝7×2＝14 條，成對（2n）。","卵細胞由減數分裂產生，每對只留一條。","7 對各留 1 條，共 7 條。","每對只剩一條，所以不成對（n）。","答案：7 條，不成對。"],"id":"g1c1v2"},{"stem":"某生物的體細胞有 12 對染色體。下列關於這種生物的卵的敘述，何者正確？","options":["2n＝24 條，成對","n＝12 條，不成對","n＝12 條，成對","n＝6 條，不成對"],"answer":1,"why":["選這個通常是把卵當成體細胞；2n＝24 條是體細胞的狀況。","正確。12 對＝24 條，卵是 n，減半成 12 條，每對只留一條，不成對。","選這個通常是條數算對了，但 n 的意思就是只有一套、每對只有一條，所以不會成對。","選這個通常是把 12 對當成 12 條再減半；要先換成 24 條再減半。"],"hints":["卵是生殖細胞，先想它是 2n（兩套）還是 n（一套）。","n 代表每對只拿一條；12 對各拿一條，會是幾條、還成對嗎？"],"solution":["體細胞 12 對＝12×2＝24 條，是 2n。","卵是生殖細胞，由減數分裂產生，是 n。","每對只留一條：12 對各留 1 條，共 12 條。","每對只剩一條，所以不成對。","答案：n＝12 條，不成對。"],"id":"g1c1v3"}]},{"type":"check","id":"g1c2","skill":"算出連續細胞分裂後的細胞數，以及每個細胞的染色體條數。","variants":[{"stem":"一個細胞有 5 對染色體，連續進行細胞分裂 2 次。下列何者正確？","options":["4 個細胞，每個 5 條","2 個細胞，每個 10 條","4 個細胞，每個 40 條","4 個細胞，每個 10 條"],"answer":3,"why":["選這個通常是把 5 對當成 5 條；5 對要換成 10 條。","選這個通常是以為分裂 2 次就是 2 個細胞；其實每分裂一次細胞數就乘 2。","選這個通常是以為每分裂一次染色體就加倍（10→20→40）；細胞分裂前雖然先複製，但會平分給子細胞，每個和原來一樣。","正確。分裂 2 次：1→2→4 個；細胞分裂數目不變，每個都是 5 對＝10 條。"],"hints":["先把題目的「5 對」圈起來，換成條數；再想細胞分裂會不會改變數目。","細胞數：1→2→？；每個細胞的條數和原來比有沒有變？"],"solution":["先換算：5 對＝5×2＝10 條。","分裂 1 次：1 個變 2 個。","分裂 2 次：2×2＝4 個。","細胞分裂後數目不變，每個細胞都是 10 條。","答案：4 個細胞，每個 10 條。"],"id":"g1c2v1"},{"stem":"某種單細胞生物的細胞有 6 條染色體，它靠細胞分裂繁殖。一個細胞連續細胞分裂 3 次後，下列何者正確？","options":["6 個細胞，每個 6 條","8 個細胞，每個 6 條","8 個細胞，每個 3 條","8 個細胞，每個 48 條"],"answer":1,"why":["選這個通常是把 2 和 3 相乘（2×3＝6）；分裂 3 次要乘 3 次 2：2×2×2＝8。","正確。分裂 3 次：1→2→4→8 個；細胞分裂數目不變，每個都是 6 條。","選這個通常是把細胞分裂當成減數分裂；減半的是減數分裂，細胞分裂數目不變。","選這個通常是把 8 個細胞的染色體全部加起來（6×8＝48）；題目問的是每個細胞有幾條。"],"hints":["細胞分裂一次，細胞數乘 2；每個細胞的染色體數目和原來一樣。","細胞數：1→2→4→？；每個細胞的條數有沒有改變？"],"solution":["分裂 1 次：1 個變 2 個。","分裂 2 次：4 個。","分裂 3 次：8 個。","細胞分裂後數目不變，每個細胞仍是 6 條。","答案：8 個細胞，每個 6 條。"],"id":"g1c2v2"},{"stem":"人的一個皮膚細胞有 23 對染色體，連續進行細胞分裂 3 次。下列何者正確？","options":["8 個細胞，每個 23 條","6 個細胞，每個 46 條","8 個細胞，每個 46 條","8 個細胞，每個 368 條"],"answer":2,"why":["選這個通常是把 23 對當成 23 條，或是把細胞分裂當成減數分裂而減半；皮膚細胞做的是細胞分裂，每個仍是 23 對＝46 條。","選這個通常是把 2 和 3 相乘（2×3＝6）；分裂 3 次要從 1 開始乘 3 次 2：1→2→4→8。","正確。分裂 3 次：1→2→4→8 個；細胞分裂數目不變，每個都是 23 對＝46 條。","選這個通常是以為每分裂一次染色體就加倍（46→92→184→368）；細胞分裂前雖然先複製，但會平分給 2 個子細胞，每個和原來一樣。"],"hints":["皮膚細胞長新細胞用的是細胞分裂，先想這種分裂會不會改變染色體數目。","細胞數 1→2→4→？；每個細胞仍是 23 對，換成條是幾條？"],"solution":["先換算：23 對＝23×2＝46 條。","分裂 1 次：1 個變 2 個。","分裂 2 次：2×2＝4 個。","分裂 3 次：4×2＝8 個。","細胞分裂後數目不變，每個細胞都是 46 條。","答案：8 個細胞，每個 46 條。"],"id":"g1c2v3"}]},{"type":"check","id":"g1c3","skill":"分辨一個情境是細胞分裂還是減數分裂，並說出結果。","variants":[{"stem":"小明跌倒擦傷了手肘，幾天後傷口長出新的皮膚。新的皮膚細胞是怎麼來的？","options":["減數分裂，新細胞的染色體數目減半","細胞分裂，新細胞的染色體數目加倍","細胞分裂，新細胞和原來的染色體數目一樣","減數分裂，新細胞和原來的染色體數目一樣"],"answer":2,"why":["選這個通常是把兩種分裂的用途記反了；減數分裂只用來做精子和卵，不負責修補傷口。","選這個通常是以為一個變兩個，染色體也跟著變兩倍；分裂前先複製、再平分，每個細胞的數目和原來一樣。","正確。傷口修補靠細胞分裂，子細胞的染色體數目和原來一樣。","選這個通常是結果記對了，但名字配錯了；數目一樣的是細胞分裂，減數分裂會減半。"],"hints":["先判斷：修補傷口是哪一種分裂的用途？","修補傷口要做出和原來一樣的皮膚細胞。哪一種分裂做出來的細胞和原來一樣？"],"solution":["傷口修補需要做出和原來一樣的皮膚細胞。","生長、修補靠的是細胞分裂。","細胞分裂：1 個變 2 個，每個子細胞的染色體數目和原來一樣。","答案：細胞分裂，新細胞和原來的染色體數目一樣。"],"id":"g1c3v1"},{"stem":"人的睪丸裡會製造精子。人的體細胞有 23 對染色體，關於製造精子的過程，下列何者正確？","options":["細胞分裂，1 個細胞變成 2 個，每個 46 條","減數分裂，1 個細胞變成 2 個，每個 23 對","減數分裂，1 個細胞最後變成 4 個，每個 23 條且成對","減數分裂，1 個細胞最後變成 4 個，每個 23 條且不成對"],"answer":3,"why":["選這個通常是把兩種分裂的用途記反了；做精子的是減數分裂，不是細胞分裂。","選這個通常是子細胞數和數目都沒換對；減數分裂是 4 個，23 對＝46 條要減半成 23 條。","選這個通常是條數算對了，但每對只留一條，這 23 條都是不同款，湊不成對。","正確。精子由減數分裂產生，1 個變 4 個，46 條減半成 23 條，每對只留一條，不成對。"],"hints":["先判斷：製造精子用的是哪一種分裂？","減數分裂會產生幾個子細胞？46 條減半後是幾條？每對留幾條？"],"solution":["製造精子用的是減數分裂。","減數分裂：染色體複製一次，細胞連續分兩次，1 個細胞最後變成 4 個。","體細胞 23 對＝46 條，減半成 23 條。","每對只留一條，所以不成對。","答案：減數分裂，1 個細胞最後變成 4 個，每個 23 條且不成對。"],"id":"g1c3v2"},{"stem":"變形蟲是單細胞生物，它靠一個細胞分成兩個來產生新個體。新的變形蟲和原來的變形蟲相比，染色體數目如何？","options":["減半，因為這是減數分裂","一樣，因為這是細胞分裂","加倍，因為一個變成兩個","一樣，因為這是減數分裂"],"answer":1,"why":["選這個通常是把兩種分裂的用途記反了；變形蟲產生新個體靠的是細胞分裂。","正確。變形蟲靠細胞分裂產生新個體，子細胞的染色體數目和原來一樣。","選這個通常是以為細胞變兩個，染色體也變兩倍；分裂前會先複製，再平分，每個都和原來一樣。","選這個通常是結果對了，但名字配錯了；數目一樣的是細胞分裂，減數分裂會減半。"],"hints":["先判斷：1 個變 2 個、用來產生變形蟲新個體的，是哪一種分裂？","這種分裂前會先複製染色體，再平分給 2 個子細胞；那每個子細胞和原來比起來呢？"],"solution":["變形蟲是 1 個細胞分成 2 個，這是細胞分裂。","細胞分裂前，染色體先複製一份。","分裂時，複製的染色體互相分離，平分到 2 個子細胞。","所以每個新變形蟲的染色體數目和原來一樣。","答案：一樣，因為這是細胞分裂。"],"id":"g1c3v3"}]}]},{"id":"g2","title":"有性還是無性：要「一模一樣」還是「新組合」","blocks":[{"type":"p","text":"這一節只要學會一件事：分辨「一模一樣」和「新組合」。考卷上的第 2、13、34 題，其實都在考這件事。把這個想法弄清楚，這三題你都能自己推出答案。"},{"type":"key","title":"一句話判斷法","lines":["**遺傳物質**：決定生物長什麼樣子、有什麼特徵的「說明書」，放在細胞裡叫**染色體**的小構造上。","**新個體**：新生出來的一隻動物或一株植物。","**親代**：生出新個體的上一代，例如爸爸、媽媽，或是長出小苗的那棵植物。","**無性生殖**：只有一個親代。新個體的遺傳物質和親代一模一樣，像影印。","**有性生殖**：精子和卵結合（這叫**受精**）。遺傳物質來自兩個親代，會有新的組合。","新的組合就像發牌：把爸爸的一半牌和媽媽的一半牌混在一起，再發出一手新的牌。每次拿到的都不一樣。","判斷時只要問一句：過程中有沒有精子和卵受精？有→有性生殖；沒有→無性生殖。"]},{"type":"key","title":"怎麼認：常見的例子","lines":["**營養器官**：植物的根、莖、葉，負責吸收、運送和製造養分。花、果實、種子是生殖器官，不算營養器官。","**孢子**：很小的一顆，**不用受精**，自己就能長成新個體。","生殖方式（怎麼做）｜例子｜新個體的遺傳物質","出芽生殖（身上長出小芽，芽長大後分開）｜水螅、酵母菌｜和親代一模一樣","斷裂生殖（身體斷成幾段，每段各長成一個新個體）｜渦蟲、海葵｜和親代一模一樣","營養器官繁殖：用葉｜落地生根（一種植物的名字）的葉子邊緣長出小苗｜和親代一模一樣","營養器官繁殖：用莖｜草莓的匍匐莖（貼著地面往旁邊爬的莖）長出小苗；扦插（剪一段枝條插進土裡）｜和親代一模一樣","營養器官繁殖：用根｜番薯的塊根（肥大、存養分的根）長出新芽｜和親代一模一樣","孢子繁殖（孢子不用受精，自己長成新個體）｜黴菌、蕨類｜和親代一模一樣","組織培養（取植物的一小塊組織，在培養瓶裡長成很多新植株）｜大量生產蘭花苗｜和親代一模一樣","有性生殖（精子和卵受精）｜開花植物結種子、松樹結松子、青蛙在水中受精產下的卵、雞產下的受精蛋、人生小孩｜新組合","注意：孢子不等於種子。種子要精子和卵受精才會有；孢子不用受精，只有一個親代。"]},{"type":"example","id":"g2e1","stem":"下列四種生物的生殖過程，哪些「一定」有新的遺傳物質組合？甲.酵母菌長出芽體；乙.番薯的塊根長出新芽；丙.青蛙在水中產卵，雄蛙排出精子讓卵受精；丁.綠豆莢裡結出綠豆（綠豆是種子）。","steps":["先把題目翻譯一下：「一定有新組合」＝「一定是有性生殖」＝「一定有精子和卵受精」。","甲：酵母菌長芽體，是出芽生殖。只有一個親代，沒有受精，所以和親代一模一樣。→ 不選。","乙：番薯用塊根長出新芽。塊根是根，屬於營養器官，所以這是營養器官繁殖。沒有受精，所以一模一樣。→ 不選。","丙：雄蛙的精子和雌蛙的卵受精。受精發生在水裡（體外受精），但還是有受精，所以是有性生殖。→ 選。","丁：綠豆是種子。植物也有精子和卵：精子在花粉裡（課本也叫精細胞），卵在雌蕊裡（雌蕊是花中央、將來會長成果實的部分）。","花粉裡的精子和卵受精後，才會長成種子。所以綠豆是有性生殖。→ 選。","整理一下：一定有新組合的是丙和丁。"],"final":"丙、丁"},{"type":"mistake","id":"g2m13","qno":13,"stem":"試問以下哪些生物的生殖過程中，必定有新的遺傳物質組合產生？\n甲.水螅的出芽生殖；乙.海葵的斷裂生殖；丙.松樹結松子；丁.眼鏡蛇產卵；戊.黑豆產生種子。","options":["甲乙","丁戊","丙丁戊","乙丁戊"],"answer":2,"yours":[1],"think":["這題的關鍵詞是「必定有新的遺傳物質組合」，意思就是在問：哪些是有性生殖，也就是哪些有精子和卵受精？","甲水螅的出芽生殖、乙海葵的斷裂生殖，都只有一個親代、沒有受精，是無性生殖，不選。","丙松樹結松子：松樹不會開花，但它的毬果（樹上一顆顆像鱗片疊起來的松果）裡也有精子和卵受精，松子就是受精後形成的種子，所以是有性生殖。","丁眼鏡蛇產卵：考題說動物「產卵」繁殖下一代，指的是會孵出小蛇的受精卵，所以是有性生殖。（超市賣的雞蛋大多沒受精，孵不出小雞，那就不算生殖。）","戊黑豆產生種子：種子是花粉裡的精子和卵受精來的，所以是有性生殖。","有性生殖的是丙、丁、戊，所以答案是 (C)。"],"optionWhy":["甲水螅出芽、乙海葵斷裂都是無性生殖，只有一個親代，新個體和親代一模一樣，沒有新組合。","你已經把丁、戊找出來了，這部分是對的。差一點的地方是漏了丙：你可能以為松樹不開花，就不是有性生殖。其實松樹的毬果裡也會受精，松子就是種子。","正確。丙的松子、丁的蛇卵、戊的黑豆種子，都是精子和卵受精來的，一定有新組合。","丁、戊是對的，但乙海葵的斷裂生殖是無性生殖，沒有受精；而且這個選項也漏了丙松子。"],"remember":"有受精才有新組合：種子、松子、受精卵、生小孩都算；不開花的植物也一樣：松樹、柏樹結種子，有經過受精，是有性生殖；孢子繁殖不用受精，是無性生殖。"},{"type":"check","id":"g2c1","skill":"判斷哪些生殖過程一定會產生新的遺傳物質組合","variants":[{"stem":"下列哪些生物的生殖過程，必定有新的遺傳物質組合產生？甲.母鴨生下的蛋，孵出小鴨；乙.酵母菌身上長出芽體，芽體長大後分開；丙.渦蟲斷成兩段，每段各長成一隻渦蟲；丁.番薯的塊根長出新芽，再長成新植株。","options":["甲乙","只有甲","乙丙丁","甲丁"],"answer":1,"why":["選這個通常是以為「長出新個體」就是新組合；乙酵母菌的出芽生殖只有一個親代，和親代一模一樣。","正確。能孵出小鴨的蛋是受精卵，由公鴨的精子和母鴨的卵受精而來，一定有新組合；其他三個都只有一個親代。","選這個通常是把「長出新個體」和「新組合」搞混；出芽、斷裂、塊根長芽都沒有受精，都是一模一樣的無性生殖。","選這個通常是把番薯塊根長出的新芽當成種子；塊根是根，屬於營養器官，用它繁殖是無性生殖。"],"hints":["先對甲、乙、丙、丁各問同一句：過程中有沒有精子和卵受精？","乙出芽、丙斷裂、丁塊根長芽，都只有一個親代。哪一個需要一雄一雌兩隻生物才能完成？"],"solution":["一定有新組合＝一定是有性生殖＝一定有精子和卵受精。","甲：蛋能孵出小鴨，代表它是受精卵，由公鴨的精子和母鴨的卵受精而來，是有性生殖。","乙：酵母菌長芽體是出芽生殖，沒有受精，是無性生殖。","丙：渦蟲斷成兩段是斷裂生殖，沒有受精，是無性生殖。","丁：番薯塊根長新芽是營養器官繁殖，沒有受精，是無性生殖。","答案：只有甲。"],"id":"g2c1v1"},{"stem":"下列哪些生物的生殖過程，必定有新的遺傳物質組合產生？甲.黴菌產生孢子；乙.母雞生下受精蛋，孵出小雞；丙.蕨類產生孢子；丁.花生結出花生仁（花生仁就是花生的種子）。","options":["甲丙","甲乙丙丁","只有乙","乙丁"],"answer":3,"why":["選這個通常是以為孢子就像種子；孢子不用受精，只有一個親代，是無性生殖，和親代一模一樣。","選這個通常是以為「有生出下一代」就一定有新組合；甲、丙的孢子繁殖不用受精，是無性生殖。","選這個通常是以為只有動物才有有性生殖；花生仁是種子，種子也是精子和卵受精來的。","正確。乙的受精蛋、丁的花生仁（種子），都是精子和卵受精來的，一定有新組合。"],"hints":["一定有新組合＝一定有精子和卵受精。把甲、乙、丙、丁一個一個檢查。","甲和丙都是孢子繁殖，孢子不用受精；再想想乙的受精蛋和丁的花生仁是怎麼來的……"],"solution":["要找的是有精子和卵受精的，也就是有性生殖。","甲黴菌產生孢子：孢子繁殖，不用受精，是無性生殖。","乙受精蛋：精子和卵受精形成的，是有性生殖。","丙蕨類產生孢子：孢子繁殖，不用受精，是無性生殖。","丁花生仁是種子：種子是花粉裡的精子和卵受精來的，是有性生殖。","答案：乙丁。"],"id":"g2c1v2"},{"stem":"下列哪些生物的生殖過程，必定有新的遺傳物質組合產生？甲.海葵斷成幾段，各長成新海葵；乙.媽媽生下小嬰兒；丙.用組織培養，把一株蘭花變成很多株蘭花苗；丁.柏樹的毬果裡長出種子（柏樹和松樹一樣不開花）。","options":["只有乙","甲丙","乙丁","乙丙丁"],"answer":2,"why":["選這個通常是以為不開花的植物就沒有有性生殖；柏樹和松樹一樣，毬果裡會受精，長出種子。","選這個通常是把「長出很多新個體」當成新組合；斷裂生殖和組織培養都只有一個親代，是無性生殖。","正確。乙的嬰兒是受精卵發育成的；丁的種子也是受精來的，兩個都一定有新組合。","選這個通常是以為在實驗室做的組織培養會產生新東西；組織培養是無性生殖，蘭花苗都和原來一模一樣。"],"hints":["先找出哪些過程有精子和卵受精。","甲和丙都只有一個親代；丁雖然不開花，但它長出的是種子還是孢子？"],"solution":["要找的是有精子和卵受精的，也就是有性生殖。","甲海葵斷裂生殖：只有一個親代，沒有受精，是無性生殖。","乙生下嬰兒：嬰兒由受精卵發育而來，是有性生殖。","丙組織培養：只有一個親代，沒有受精，是無性生殖。","丁柏樹長出種子：種子是受精來的，是有性生殖，不開花也一樣。","答案：乙丁。"],"id":"g2c1v3"}]},{"type":"key","title":"想要什麼，就選什麼方法","lines":["**品種**：同一種植物裡，特徵不一樣的類型，例如又大又甜的柚子和比較酸的柚子。","想要和原來「一模一樣」（例如阿公家好吃的柚子）→ 用**無性生殖**。","常用方法：**扦插**（剪一段枝條插進土裡）、**壓條**（把枝條壓進土裡，長出根後再剪下來）、**嫁接**（把枝條接到另一棵植物的莖上）。","嫁接時，接上去的枝條長出的花和果實，跟枝條原來那棵樹一樣。下面那棵樹只負責吸水、提供養分，像幫忙的「底座」，不會改變上面結的果子。","想要「新品種」（有新特徵的植物）→ 用**有性生殖**，也就是種種子。","**授粉**：花粉被蜜蜂或風帶到雌蕊上（可能是另一朵花，也可能是同一朵花）。花粉裡有精子，雌蕊裡有卵。授粉之後，精子和卵才會受精，長成種子。","所以：授粉 → 受精 → 種子 → 新組合。","新組合怎麼變出新特徵？例如 A 番茄很耐熱但果子小，B 番茄果子大但怕熱。","讓 A 和 B 授粉，種出來的番茄裡，可能有一株剛好拿到 A 的「耐熱」和 B 的「果子大」。它就是又耐熱、果子又大的新品種。"]},{"type":"trap","wrong":"種子種下去，長出來的植物會和原來那棵一模一樣。","right":"種子是精子和卵受精來的，是新組合，種出來不一定一樣。","reason":"植物也有「媽媽」和「爸爸」：結果子的那棵樹提供卵，花粉提供精子，而花粉常被蜜蜂或風從別棵樹帶來。所以阿公家柚子裡的種子，可能一半來自阿公的樹、一半來自隔壁的樹，遺傳物質重新組合。種出來的柚子就可能變小或變酸。"},{"type":"trap","wrong":"營養器官繁殖（例如用葉子、枝條長出新植株）也可以培育新品種。","right":"營養器官繁殖是無性生殖，只能做出一模一樣的植株，培育不出新品種。","reason":"營養器官繁殖只有一個親代，沒有受精。沒有受精，遺傳物質就沒有新組合。沒有新組合，就不會出現新特徵。"},{"type":"mistake","id":"g2m2","qno":2,"stem":"小佑最愛吃阿公家的柚子，他想種出和阿公家一樣又大又甜的柚子，最適合用下列哪一個構造來繁殖？","options":["一個果實","一粒種子","一段枝條","一些果皮"],"answer":2,"yours":[0,1],"think":["這題的關鍵詞是「和阿公家一樣」，意思是新植株的遺傳物質要和原來「一模一樣」。","要一模一樣，就要用無性生殖，因為只有一個親代，像影印。","果實能長出新植株，靠的是裡面的種子；種子是花粉裡的精子和卵受精來的，是有性生殖，會有新組合。","所以用果實或種子種出來的柚子，不一定又大又甜。","枝條是植物的莖，屬於營養器官；用枝條扦插或嫁接，是營養器官繁殖，屬於無性生殖。","新植株會和阿公家的柚子樹一模一樣，所以答案是 (C)。"],"optionWhy":["你可能想：果實就是柚子本身，種下去就會長出一樣的柚子。差一點的地方是：果實會長出新植株，靠的是裡面的種子，而種子是新組合。","你可能以為種子就是植物的「複製品」。其實種子是受精來的，花粉還可能來自別棵柚子樹，遺傳物質來自兩個親代，種出來的柚子可能變小、變酸。","正確。枝條用扦插或嫁接繁殖，是無性生殖，新植株和阿公家的柚子樹一模一樣。","果皮只是果實外面那一層，不會長出新植株，沒辦法拿來繁殖。"],"remember":"要「一模一樣」→ 用枝條（扦插、嫁接、壓條），不要用果實或種子。"},{"type":"mistake","id":"g2m34","qno":34,"stem":"右圖為落地生根的葉片，葉片上可長出新植株。若想要培育「新品種」的落地生根，應採用的繁殖法是下列哪一種？","options":["種子繁殖","孢子繁殖","出芽生殖","營養器官繁殖"],"answer":0,"yours":[3],"think":["這題的關鍵詞是「新品種」。新品種就是有新特徵的植物，例如新的花色或葉形。","要出現新特徵，遺傳物質就要有新的組合。","會產生新組合的只有有性生殖，也就是要有精子和卵受精。","落地生根是開花植物，它授粉、受精後會結出種子，這就是它的有性生殖。","題目圖中葉片長出新植株，是營養器官繁殖，屬於無性生殖，只會一模一樣。這張圖只是在介紹落地生根，不是答案。","所以要用種子繁殖，答案是 (A)。"],"optionWhy":["正確。種子是受精來的，遺傳物質有新組合，才可能出現新特徵，培育出新品種。","孢子繁殖是無性生殖，只會和親代一模一樣；而且落地生根是開花植物，不靠孢子繁殖。","出芽生殖是水螅、酵母菌那種身上長小芽的方式，屬於無性生殖，不會產生新品種。","你可能看到題目說「葉片上可長出新植株」，就選了它，這很自然。差一點的地方是：葉片長新植株確實能繁殖落地生根，但它是無性生殖，新植株一模一樣，培育不出新品種。下次先圈出題目要的是「一模一樣」還是「新品種」，再選方法；題目圖片介紹的方法，不一定就是答案。"],"remember":"先圈出題目要「一模一樣」（用無性生殖）還是「新品種」（用種子，有性生殖），再選方法；題目圖片介紹的繁殖方式不一定就是答案。"},{"type":"check","id":"g2c2","skill":"想要和原來一模一樣時，要選無性生殖的繁殖方法","variants":[{"stem":"阿姨種的玫瑰花顏色特別漂亮。她想再多種幾株，花色要和這株完全一樣。最適合怎麼做？","options":["收集這株玫瑰的種子來播種","剪下一段枝條插進土裡（扦插）","摘下花瓣埋進土裡","讓這株玫瑰和別株玫瑰授粉，再把種子種下去"],"answer":1,"why":["選這個通常是以為種子種出來會和原來一樣；種子是受精來的，是新組合，花色不一定相同。","正確。扦插是營養器官繁殖，屬於無性生殖，新植株和原來一模一樣。","選這個通常是以為植物哪個部位都能長新植株；花瓣不會長成新植株。","選這個通常是以為授粉能保留特徵；授粉後受精形成的種子是新組合，花色更可能不一樣。"],"hints":["先判斷：想要「一模一樣」，要用有性生殖還是無性生殖？","一模一樣要用無性生殖，所以凡是要用到種子的方法，都可以先刪掉……"],"solution":["題目要「完全一樣」，所以要用無性生殖。","種子是受精來的，是新組合，所以播種、授粉後播種都不行。","花瓣不能長成新植株，不能用來繁殖。","扦插是用枝條繁殖，屬於無性生殖，新植株一模一樣。","答案：剪下一段枝條扦插。"],"id":"g2c2v1"},{"stem":"果農發現一棵芒果樹結的芒果特別香甜。他想得到更多棵會結出一模一樣芒果的樹。下列哪一種方法**不適合**？","options":["剪下這棵樹的枝條，嫁接到其他芒果樹的莖上","取這棵樹的一小塊組織，用組織培養長出很多芒果苗","把這棵樹結的芒果裡的種子種下去","把這棵樹的枝條壓進土裡，長出根後剪下來種（壓條）"],"answer":2,"why":["選這個通常是擔心下面那棵樹會改變果子；其實接上去的枝條結的果子和原來的樹一樣，嫁接是適合的方法。","選這個通常是以為在實驗室做的就會改變；組織培養只有一個親代，是無性生殖，長出的苗一模一樣，是適合的方法。","正確，這個不適合。種子是受精來的，花粉可能來自別棵芒果樹，是新組合，種出來的芒果不一定香甜。","選這個通常是對壓條不熟；壓條是用枝條長出新植株，屬於無性生殖，是適合的方法。"],"hints":["題目問的是「不適合」。先判斷：想要一模一樣，要用無性生殖還是有性生殖？","嫁接、壓條、組織培養都只有一個親代。剩下那個方法用到的構造，是怎麼來的？"],"solution":["題目問「不適合」，所以要找出做不到一模一樣的方法。","想要一模一樣，要用無性生殖，只有一個親代。","嫁接、壓條都是用枝條繁殖；組織培養也只有一個親代。這三個都是無性生殖，都適合。","芒果裡的種子是受精來的，花粉可能來自別棵樹，是新組合，種出來不一定一樣。","答案：把芒果裡的種子種下去，這個不適合。"],"id":"g2c2v2"},{"stem":"小美家的草莓特別甜。草莓會長出匍匐莖（貼著地面往旁邊爬的莖），莖上會長出小草莓苗。她想種出一樣甜的草莓，最適合怎麼做？","options":["收集草莓表面的小粒（裡面有種子）來播種","用孢子來繁殖這株草莓","剪下草莓的花，插進土裡","把匍匐莖上長出的小草莓苗挖起來種"],"answer":3,"why":["選這個通常是以為種子種出來會和原來一樣；小粒裡的種子是受精來的，是新組合，甜度不一定相同。","選這個通常是以為孢子繁殖也能用在草莓；草莓是開花植物，不靠孢子繁殖，孢子繁殖是黴菌、蕨類的方式。","選這個通常是以為花剪下來就能長成新植株；花是生殖器官，插進土裡不會長成新植株。","正確。匍匐莖長出的小苗是營養器官繁殖，屬於無性生殖，和原來的草莓一模一樣。"],"hints":["先判斷：想要「一樣甜」，要用一模一樣的無性生殖，還是新組合的有性生殖？","要用無性生殖。題目提到的匍匐莖，屬於植物的哪一種器官？"],"solution":["題目要「一樣甜」，也就是一模一樣，所以要用無性生殖。","小粒裡的種子是受精來的，是新組合，所以播種不行。","草莓是開花植物，不靠孢子繁殖；剪下的花也不會長成新植株。","匍匐莖是莖，屬於營養器官；用它長出的小苗繁殖，是無性生殖。","答案：把匍匐莖上長出的小草莓苗挖起來種。"],"id":"g2c2v3"}]},{"type":"check","id":"g2c3","skill":"培育新品種要用有性生殖，並說得出原因","variants":[{"stem":"農業改良場想培育出一種「更甜」的新品種西瓜。應該用哪一種方法？原因是什麼？（注意：方法和原因都要對。）","options":["方法：剪下西瓜的莖扦插／原因：扦插長得比較快，很快就能得到新品種","方法：用組織培養大量繁殖西瓜苗／原因：苗的數量多，其中自然會出現新品種","方法：讓不同品種的西瓜授粉，種下種子／原因：種子和親代一模一樣，能把好特徵保留下來","方法：讓不同品種的西瓜授粉，種下種子／原因：受精會產生新組合，才可能出現新特徵"],"answer":3,"why":["選這個通常是把「長得快」當成「新品種」；扦插是無性生殖，長出來的西瓜和原來一模一樣。","選這個通常是以為數量多就會出現新特徵；組織培養是無性生殖，每一株都一模一樣。","選這個通常是方法選對了，但原因想反了；種子是新組合，不是和親代一模一樣。","正確。方法和原因都對：受精產生新組合，才可能出現「更甜」這種新特徵。"],"hints":["先判斷：要出現新特徵，遺傳物質需要「一模一樣」還是「新組合」？","需要新組合，就要有精子和卵受精，所以要用……生殖；有兩個選項方法一樣，要再比較它們的原因。"],"solution":["新品種要有新特徵，新特徵要靠遺傳物質的新組合。","新組合只會出現在有性生殖，也就是要有精子和卵受精。","扦插、組織培養都是無性生殖，只會一模一樣，先刪掉。","剩下兩個都是授粉後種種子，要再看原因：種子是新組合，不是一模一樣。","答案：讓不同品種的西瓜授粉、種下種子，因為受精會產生新組合。"],"id":"g2c3v1"},{"stem":"花農想培育出一種新花色的蝴蝶蘭。應該用哪一種方法？原因是什麼？（注意：方法和原因都要對。）","options":["方法：讓兩種不同花色的蝴蝶蘭授粉，用結出的種子培育／原因：受精會產生新的遺傳物質組合","方法：用組織培養大量繁殖原來的蝴蝶蘭／原因：植株數量多，就會出現新花色","方法：剪下一段蝴蝶蘭的莖去繁殖／原因：換個地方種，花色就會改變","方法：用孢子繁殖蝴蝶蘭／原因：孢子和種子一樣，會有新組合"],"answer":0,"why":["正確。授粉後受精形成種子，遺傳物質來自兩個親代，有新組合，才可能出現新花色。","選這個通常是以為數量多就會出現新特徵；組織培養是無性生殖，每一株都和原來一模一樣。","選這個通常是以為換環境就能變成新品種；用莖繁殖是營養器官繁殖，遺傳物質和原來一模一樣。","選這個通常是把孢子當成種子；孢子不用受精，是無性生殖，而且蝴蝶蘭是開花植物，不靠孢子繁殖。"],"hints":["先判斷：新花色需要遺傳物質「一模一樣」還是「新組合」？","新組合要靠精子和卵受精；四個方法裡，哪一個會用到受精產生的種子？"],"solution":["新花色是新特徵，要靠遺傳物質的新組合。","新組合只會出現在有性生殖，也就是要有精子和卵受精。","組織培養、用莖繁殖都是無性生殖，只會一模一樣。","孢子繁殖也是無性生殖，而且蝴蝶蘭是開花植物，不用孢子繁殖。","答案：讓兩種不同花色的蝴蝶蘭授粉，用種子培育，因為受精會產生新組合。"],"id":"g2c3v2"},{"stem":"研究人員想培育出產量更高的新品種水稻。應該用哪一種方法？原因是什麼？（注意：方法和原因都要對。）","options":["方法：讓水稻長出芽體，用出芽生殖培育／原因：芽體是新長出來的，所以是新品種","方法：剪一段水稻的莖插進土裡／原因：營養器官繁殖能改變特徵","方法：讓兩個不同品種的水稻授粉，種下結出的稻穀（稻穀是果實，裡面有種子）／原因：遺傳物質來自兩個親代，會有新組合","方法：把同一株水稻自己結的稻穀種下去／原因：稻穀裡的種子和親代一模一樣，好特徵會保留下來"],"answer":2,"why":["選這個通常是以為「新長出來」就是「新品種」；出芽生殖是無性生殖，和親代一模一樣，而且水稻也不是用出芽生殖繁殖。","選這個通常是以為營養器官繁殖能培育新品種；它是無性生殖，長出來的和原來一模一樣。","正確。授粉後受精，稻穀裡形成種子，遺傳物質來自兩個親代，有新組合，才可能出現產量更高的新特徵。","選這個通常是以為種子和親代一模一樣；稻穀裡的種子是受精來的新組合，而且題目要的是新品種，不是保留原樣。"],"hints":["先判斷：「新品種」需要遺傳物質「一模一樣」還是「新組合」？","需要新組合，就要有性生殖；再檢查選項的原因有沒有說對「新組合從哪裡來」。"],"solution":["新品種要有新特徵，新特徵要靠遺傳物質的新組合。","新組合只會出現在有性生殖，也就是要有精子和卵受精。","出芽生殖、用莖繁殖都是無性生殖，只會一模一樣，先刪掉。","剩下兩個都種稻穀，但「稻穀裡的種子和親代一模一樣」這個原因是錯的；稻穀裡的種子是受精來的新組合。","答案：讓兩個不同品種的水稻授粉，種下稻穀，因為遺傳物質來自兩個親代，會有新組合。"],"id":"g2c3v3"}]},{"type":"why","title":"想知道為什麼？","lines":["無性生殖只靠**細胞分裂**：1 個細胞變 2 個，每個細胞的染色體都和原來一模一樣。所以新個體像影印。","染色體是兩條兩條成對的。每一對裡，一條來自爸爸、一條來自媽媽。","做精子或卵時，要先做一種特別的分裂，叫**減數分裂**：每一對只挑一條放進精子或卵。所以數目剩一半。","課本用 2n 表示「成對的、完整的數目」，用 n 表示「一半」。以人為例：2n＝46 條（23 對），n＝23 條。","每對挑哪一條，每次都可能不一樣。假設只有 2 對染色體：第 1 對是 A 和 a，第 2 對是 B 和 b。","每對挑一條，可以挑出 AB、Ab、aB、ab 四種。只有 2 對就有 4 種；人有 23 對，就有八百多萬種，所以每個精子、每個卵幾乎都不一樣。","受精時，精子（n）＋卵（n）＝受精卵（2n），染色體又變回成對。","受精卵裡每一對都是一條來自爸爸、一條來自媽媽，組合是全新的，就像把兩個人的牌混在一起，再發出一手新牌。","這就是為什麼種子、受精卵一定是新組合；而扦插、出芽、斷裂只會一模一樣。"]},{"type":"p","text":"想自己看看「每對挑一條」嗎？下面的小工具已經切到「減數分裂」，一直按「下一步」：最後 4 個細胞裡，藍黃的組合不只一種。再按「受精」，看精子和卵怎麼合成新的一對一對。"},{"type":"demo","name":"chromo","mode":"meiosis"}]},{"id":"g3","title":"開花植物：授粉、花粉管、受精、種子","blocks":[{"type":"p","text":"這一節的三題錯題，其實都在問同一件事：一朵花怎麼變成果實和種子。只要先把花的零件認清楚，再記住「誰先誰後」，三題都能自己推出來。我們一步一步來。"},{"type":"key","title":"花的零件，一個一個認","lines":["**雌蕊**：花正中央產生卵的部分，形狀像一個小瓶子。由上到下是柱頭、花柱、子房，子房裡還有胚珠。","・**柱頭**：瓶口，在最上面，黏黏的，用來接住花粉","・**花柱**：瓶頸，細細長長的通道","・**子房**：瓶身，最下面鼓起來的地方","・**胚珠**：子房裡一顆一顆的小圓粒；**卵**（雌的生殖細胞，很小，眼睛看不到，不是雞蛋那種卵）就藏在胚珠裡","**雄蕊**：圍在雌蕊旁邊，產生花粉的部分，有兩個零件。","・**花藥**：頂端的小袋子，裝花粉","・**花絲**：下面細細的柄，撐住花藥","花粉不是精子本身。每一粒花粉像一個小包裹，裡面裝著**精細胞**（雄的生殖細胞）。"]},{"type":"key","title":"受精以後，零件會變成什麼","lines":["**子房 → 果實**","**胚珠 → 種子**","一個胚珠受精後，會變成一粒種子。","如果有胚珠沒受精，它就不會變成種子。","所以子房裡有幾個胚珠，最多就有幾粒種子。","反過來看：果實裡有很多種子，子房裡就一定有很多胚珠。"]},{"type":"key","title":"開花植物有性生殖的順序","lines":["**有性生殖**：要讓精細胞和卵結合（受精），才能生出下一代。","1. **授粉**：花粉落到雌蕊的柱頭上","2. **長出花粉管**：花粉在柱頭上長出一條管子，往下伸到胚珠","3. **受精**：花粉管裡的精細胞，和胚珠裡的卵結合","4. **形成種子**：胚珠變成種子，子房變成果實","5. **萌芽**：種子發芽，長成一棵新的植物（課本叫「新個體」）","好記說法：花粉「降落」→「挖隧道」→「送到卵的家」→「卵的家變種子」→「發芽」"]},{"type":"p","text":"花粉落在柱頭上，可是卵在很下面的胚珠裡，中間隔著一段花柱。花粉管就像一條隧道，從柱頭穿過花柱，一路伸到胚珠。精細胞沒有尾巴、自己不會游，就坐在這條管子裡，被送到卵的旁邊去受精。"},{"type":"trap","wrong":"授粉就是受精，花粉一落到柱頭上，受精就完成了。","right":"授粉是花粉落到柱頭上；受精是精細胞和胚珠裡的卵結合。授粉在前，受精在後，中間還隔著「長出花粉管」。","reason":"兩個詞只差一個字，又都和花粉有關，所以很容易混。可以這樣記：「授」粉是把花粉交給柱頭，「受」精是卵接受精細胞。花粉停在柱頭上時，卵還在下面的胚珠裡，距離很遠，所以授粉完還不算受精。"},{"type":"mistake","id":"g3m4","qno":4,"stem":"一般開花植物行有性生殖時，須經過下列步驟，則先後順序為何？\n甲.受精；乙.授粉；丙.新個體萌芽；丁.形成種子；戊.長出花粉管。","options":["乙甲丁戊丙","甲乙丁戊丙","丁戊甲乙丙","乙戊甲丁丙"],"answer":3,"yours":[0],"think":["這題要排出五個步驟的先後；題目用甲乙丙丁戊代替步驟，很容易排亂，也要注意「授粉」和「受精」是兩件不同的事。","先在每個代號旁邊寫上中文：甲＝受精、乙＝授粉、丙＝萌芽、丁＝種子、戊＝花粉管；先用中文排好順序，最後再換回代號。","第一步是花粉先落到柱頭上，也就是授粉（乙）。","花粉落到柱頭以後才長出花粉管（戊），精細胞順著花粉管到了卵旁邊，才能受精（甲）。","受精以後胚珠變成種子（丁），種子再萌芽成新個體（丙）。","中文順序是授粉 → 花粉管 → 受精 → 種子 → 萌芽，換回代號是乙戊甲丁丙，答案是 (D)。"],"optionWhy":["你抓對了第一步是授粉，這很棒；差一點的是把花粉管（戊）排到受精（甲）和種子後面，你可能以為花粉管是種子發芽時長出的管子。其實花粉管是花粉長的，要先把精細胞送下去才能受精，那時連種子都還沒有。","選這個通常是把受精當成第一步；但花粉要先落到柱頭上（授粉），才有機會受精。","選這個是把種子放到最前面；種子是受精之後胚珠才變成的，不可能比授粉、受精還早。","正確：授粉 → 長出花粉管 → 受精 → 形成種子 → 萌芽，每一步都要前一步完成才會發生。"],"remember":"先授粉、再長花粉管、才受精；花粉管是花粉長的、負責送精細胞去受精，所以一定夾在授粉和受精中間。"},{"type":"check","id":"g3c1","skill":"把開花植物有性生殖的步驟排出正確順序。","variants":[{"stem":"下列是開花植物有性生殖的部分過程：甲．胚珠發育成種子；乙．精細胞與卵結合；丙．花粉落到柱頭上；丁．花粉管伸到胚珠。正確的先後順序是哪一個？","options":["丙乙丁甲","乙丙丁甲","丙丁乙甲","丁丙乙甲"],"answer":2,"why":["選這個通常是以為花粉一落到柱頭就直接受精，忘了中間要靠花粉管把精細胞送下去。","選這個通常是把受精當成第一步；花粉要先落到柱頭上，才可能受精。","正確：先授粉（丙），再由花粉管把精細胞送到胚珠（丁），然後受精（乙），最後胚珠變成種子（甲）。","選這個通常是以為花粉管先長好再等花粉；其實花粉管是花粉落到柱頭以後，才由花粉長出來的。"],"hints":["先在每個代號旁寫上中文，再找第一步：花粉一開始要先到哪裡？","花粉到了柱頭以後，精細胞還在花粉裡、停在柱頭上，卵在下面的胚珠裡；要先有什麼，精細胞才過得去？"],"solution":["先寫中文：甲＝種子、乙＝受精、丙＝授粉、丁＝花粉管。","花粉要先落到柱頭上，這是授粉，所以第一個是丙。","花粉在柱頭上長出花粉管，伸到胚珠，所以第二個是丁。","精細胞被送到卵旁邊，和卵結合，這是受精，所以第三個是乙。","受精以後胚珠發育成種子，所以最後是甲。","順序是丙丁乙甲。"],"id":"g3c1v1"},{"stem":"芒果樹開花時，蜜蜂把一朵花的花粉帶到另一朵花的柱頭上。在這之後，最先發生的是哪一件事？","options":["精細胞立刻和卵結合","花粉長出花粉管，往胚珠伸過去","子房發育成果實","胚珠發育成種子"],"answer":1,"why":["選這個通常是把授粉當成受精；花粉還停在柱頭上，離胚珠裡的卵還很遠，要先長出花粉管才送得到。","正確：花粉落到柱頭（授粉）以後，下一步就是長出花粉管，準備把精細胞送到胚珠。","選這個是跳了好幾步；子房要等受精以後才會發育成果實。","選這個也是跳步；胚珠要先受精，才會發育成種子。"],"hints":["蜜蜂把花粉帶到柱頭上，這一步叫什麼？它的下一步是什麼？","花粉在柱頭上，卵在子房的胚珠裡，中間隔著花柱；精細胞要先有一條「路」才過得去。"],"solution":["蜜蜂把花粉帶到柱頭上，這一步是授粉。","授粉後，卵還在下面的胚珠裡，精細胞過不去。","所以花粉會先長出花粉管，穿過花柱往胚珠伸。","受精、結種子、結果實，都要在花粉管送到之後才會發生。","最先發生的是：花粉長出花粉管。"],"id":"g3c1v2"},{"stem":"番茄花的雌蕊裡，有一條花粉管剛剛伸到胚珠旁邊，裡面的精細胞還沒有和卵結合。這時候，下列哪一件事「已經發生過」了？","options":["精細胞和卵結合（受精）","胚珠發育成種子","子房發育成果實","花粉落到柱頭上（授粉）"],"answer":3,"why":["選這個通常是把「花粉管到了」當成「受精完成」；題目說精細胞還沒和卵結合，所以受精還沒發生。","選這個是把順序往後跳了；胚珠要受精以後才會變成種子，現在連受精都還沒發生。","選這個也是跳步；子房要等受精以後才發育成果實。","正確：花粉管是花粉落到柱頭以後才長出來的，所以現在看到花粉管，代表授粉一定已經發生過了。"],"hints":["先想：花粉管是在哪一步之後才長出來的？","順序是授粉 → 長出花粉管 → 受精 → 形成種子。現在走到「花粉管」這一步，排在它前面的是……"],"solution":["開花植物的順序是：授粉 → 長出花粉管 → 受精 → 形成種子（子房變果實）。","題目說花粉管已經伸到胚珠旁邊，所以「長出花粉管」正在發生。","排在花粉管前面的步驟是授粉，所以授粉已經發生過了。","題目說精細胞還沒和卵結合，所以受精、形成種子、形成果實都還沒發生。","答案是：花粉落到柱頭上（授粉）。"],"id":"g3c1v3"}]},{"type":"why","title":"這段跟第 5 題有關：為什麼不用水？","lines":["苔蘚、蕨類的精子有小尾巴，會像蝌蚪一樣游泳，但一定要有水才游得動。","所以它們受精時，環境一定要有水，例如下雨後或潮濕的地方。","開花植物的精細胞沒有尾巴，自己不會游：花粉先被風或昆蟲帶到柱頭，再長出花粉管，把精細胞直接送到胚珠。","「媒介」就是中間幫忙傳送的東西，像快遞員。「以水為媒介」是說要靠水，精子才到得了卵那裡；「不須以水為媒介」是說不用靠水也能受精。","開花植物和松、杉這類植物都會產生種子，合稱**種子植物**；它們的精細胞都是靠花粉管送到胚珠。","因為受精不需要水當媒介，種子植物在比較乾燥的陸地上也能繁殖，這是它們分布很廣的原因之一。"]},{"type":"trap","wrong":"花粉管是用來吸引昆蟲，或是幫忙把花粉傳到柱頭上的。","right":"花粉管是花粉「已經」落在柱頭上之後才長出來的；它的工作是把精細胞送到胚珠，和卵受精。","reason":"吸引昆蟲靠的是花瓣的顏色、香味和花蜜。把花粉帶到柱頭（授粉）靠的是風、昆蟲等。花粉管藏在雌蕊裡面，昆蟲根本看不到，它的工作在授粉之後才開始。"},{"type":"mistake","id":"g3m5","qno":5,"stem":"對種子植物的有性生殖而言，花粉管的形成有何意義？","options":["不需媒介而能將花粉送到雌蕊柱頭上","可吸引昆蟲前來協助傳粉","能將種子散播到遠處","不須以水為媒介而能將精細胞送到胚珠中，與卵受精"],"answer":3,"yours":[1],"think":["這題問花粉管的形成有什麼「意義」，也就是：有了花粉管，植物多了什麼好處？先想清楚花粉管在哪一步出現、在做什麼。","花粉管是花粉已經落在柱頭上（授粉）之後才長出來的，所以它不負責把花粉送到柱頭，也不負責吸引昆蟲。","花粉管往下伸到子房裡的胚珠，精細胞順著它被送到卵的旁邊。","拿沒有花粉管的蕨類來比：蕨類的精子要在水裡游，所以只能在潮濕的地方受精。","有了花粉管，精細胞不用游，受精就不用靠水；題目說的「不須以水為媒介」，意思就是不用靠水幫忙傳送。","這個「不用水也能受精」就是花粉管的意義，答案是 (D)。"],"optionWhy":["選這個是把花粉管和授粉搞混了；把花粉送到柱頭上是授粉，靠風或昆蟲，花粉管要等授粉之後才長出來。","你可能想到花和昆蟲常常一起出現，這樣想很自然；不過吸引昆蟲的是花瓣的顏色、香味和花蜜，花粉管藏在雌蕊裡面，昆蟲看不到它。","選這個是把花粉管當成散播種子的方法；散播種子靠果實（例如被動物吃掉、隨風飛），而且花粉管出現時，種子根本還沒形成。","正確：花粉管把精細胞直接送到胚珠，和卵受精，所以種子植物受精不需要水當媒介。"],"remember":"花粉管＝送精細胞到胚珠的隧道，讓受精不用靠水；吸引昆蟲靠花瓣和花蜜，不是花粉管。"},{"type":"check","id":"g3c2","skill":"說出花粉管的作用，以及為什麼種子植物受精不需要水。","variants":[{"stem":"蕨類要在潮濕、有水的環境才能完成受精，但玉米、向日葵（它們都是種子植物）在比較乾燥的地方也能完成受精。主要原因是什麼？","options":["種子植物的花粉靠風吹，所以受精不需要水","種子植物有花粉管，能把精細胞直接送到卵旁邊","種子植物不需要受精，也能產生種子","種子植物的精子在水裡游得比較快"],"answer":1,"why":["選這個通常是把授粉和受精搞混了；玉米真的是靠風吹花粉沒錯，但那是授粉，花粉到了柱頭以後，還要靠花粉管才能受精。","正確：玉米、向日葵是開花植物，花粉管會穿過花柱伸到胚珠，精細胞順著管子被送到卵旁邊，不用在水裡游。","選這個是以為種子植物不用受精；種子是胚珠受精以後才發育成的，有性生殖一定要受精。","選這個是以為種子植物的精細胞也要游過去；其實它沒有尾巴，自己不會游，是被花粉管送過去的。"],"hints":["先分清楚：題目問的是「受精」需不需要水，不是「授粉」。","蕨類的精子要靠水游到卵那裡；種子植物的精細胞，是靠哪一個構造送到卵旁邊的？"],"solution":["蕨類的精子要在水裡游，才能到卵那裡受精，所以需要水。","玉米、向日葵授粉後，花粉會長出花粉管。","花粉管穿過花柱伸到胚珠，把精細胞直接送到卵旁邊。","所以它們受精不需要水當媒介，乾燥的地方也能受精。","答案是：種子植物有花粉管，能把精細胞直接送到卵旁邊。"],"id":"g3c2v1"},{"stem":"小明說：「花粉管是花粉落到柱頭上以後長出來的管子。」關於花粉管的作用，下列哪一個說法正確？","options":["把花粉從花藥送到柱頭上","發出香味，吸引蜜蜂來採蜜","把精細胞送到胚珠，讓它和卵結合","把胚珠裡的卵送到柱頭上"],"answer":2,"why":["選這個通常是把花粉管當成授粉的工具；花粉從花藥到柱頭是授粉，靠風或昆蟲，那時花粉管還沒長出來。","選這個是把花粉管和花瓣、花蜜的功能搞混了；吸引蜜蜂的是花的顏色、香味和花蜜。","正確：花粉管從柱頭伸到胚珠，精細胞順著它到達卵的旁邊，完成受精。","選這個是把方向弄反了；卵一直留在胚珠裡不動，是精細胞順著花粉管往下送過去。"],"hints":["小明的話已經告訴你：花粉管出現時，花粉已經在柱頭上了。所以它不是用來做「授粉」的。","花粉管從柱頭往下伸，終點是子房裡的胚珠；胚珠裡有什麼在等著？"],"solution":["花粉管是花粉落到柱頭以後才長出來的，所以授粉已經完成，它不負責送花粉到柱頭。","花粉管從柱頭穿過花柱，往下伸到胚珠。","胚珠裡有卵，卵不會移動。","精細胞順著花粉管被送到卵旁邊，和卵結合，完成受精。","答案是：把精細胞送到胚珠，讓它和卵結合。"],"id":"g3c2v2"},{"stem":"百合花的花粉已經落到柱頭上，但研究人員用藥物讓這些花粉「無法長出花粉管」。這朵花最可能會怎樣？","options":["無法授粉，因為花粉落不到柱頭上","照樣可以受精，因為花粉已經在柱頭上了","照樣可以結種子，只是不能吸引昆蟲","無法受精，所以胚珠不會發育成種子"],"answer":3,"why":["選這個是把授粉和受精搞混了；題目說花粉已經落到柱頭上，授粉其實已經完成了。","選這個通常是以為授粉就等於受精；花粉在柱頭上，卵在下面的胚珠裡，沒有花粉管就送不過去。","選這個是以為花粉管負責吸引昆蟲；花粉管的工作是送精細胞去受精，沒有它就無法受精、結種子。","正確：沒有花粉管，精細胞到不了胚珠裡的卵，就無法受精，胚珠也就不會變成種子。"],"hints":["先判斷：花粉已經在柱頭上，代表哪一步已經完成？少了花粉管，卡在哪一步？","花粉管是送精細胞到胚珠的路；路斷了，精細胞和卵還碰得到嗎？碰不到的話，種子會出現嗎？"],"solution":["花粉已經落到柱頭上，所以授粉已經完成。","下一步本來是長出花粉管，把精細胞送到胚珠。","現在花粉管長不出來，精細胞到不了卵旁邊，所以無法受精。","胚珠要受精以後才會發育成種子，所以也不會有種子。","答案是：無法受精，所以胚珠不會發育成種子。"],"id":"g3c2v3"}]},{"type":"example","id":"g3e1","stem":"小美讀到兩種植物雌蕊的說明：甲植物的子房裡只有 1 個胚珠；乙植物的子房裡有很多個胚珠。如果甲、乙分別是「龍眼」和「番茄」其中一種，甲、乙各最可能是哪一種？","steps":["先想規則：受精以後，胚珠會變成種子。","所以一個胚珠最多變成一粒種子；胚珠有幾個，種子最多就有幾粒。","甲的子房裡只有 1 個胚珠，所以甲的果實裡最多只有 1 粒種子。","乙的子房裡有很多個胚珠，所以乙的果實裡可能有很多粒種子。","再想水果：龍眼剝開，裡面只有一粒黑色的種子；番茄切開，裡面有很多小小的籽。","番茄有很多籽，不可能是只有 1 個胚珠的甲，所以番茄是乙，龍眼是甲。"],"final":"甲：龍眼（1 個胚珠 → 最多 1 粒種子）；乙：番茄（很多胚珠 → 很多種子）"},{"type":"mistake","id":"g3m16","qno":16,"stem":"右圖為某植物雌蕊的構造，試由此圖判斷，此植物可能是下列哪一種水果？","options":["芭樂","荔枝","水蜜桃","芒果"],"answer":0,"yours":[1],"fig":"pistil","figText":"（圖：雌蕊由上而下是柱頭、花柱、子房；子房裡排著很多個胚珠。）","think":["這題要你從雌蕊的圖推出是哪一種水果；關鍵是看子房裡「胚珠有幾個」。","看圖中最下面鼓起來的地方，那是子房；裡面一顆一顆的小圓粒就是胚珠，數數看，有很多顆。","受精以後每個胚珠會變成一粒種子，所以這種植物的果實裡，可能有很多粒種子。","再把選項的水果在腦中切開：芭樂有很多小籽；荔枝、水蜜桃、芒果通常都只有一粒種子。","只有芭樂和「很多胚珠 → 很多種子」相符，答案是 (A)。"],"optionWhy":["正確：芭樂切開有很多小籽，和圖中子房裡有很多胚珠、會結出很多種子的樣子相符。","你可能是從熟悉的水果去猜，這很自然；這題的關鍵是先數胚珠，圖中很多胚珠會結出很多種子，但荔枝通常只結一粒大種子，所以和圖不合。","水蜜桃中間只有一個硬核，核裡通常只有一粒種子，和圖中「很多胚珠 → 很多種子」不合。","芒果裡只有一粒大種子，不會像圖中雌蕊那樣結出很多種子，所以和圖不合。"],"remember":"胚珠會變成種子：子房裡很多胚珠，就找籽很多的水果（芭樂、番茄、西瓜）；只結一粒種子的水果（芒果、荔枝、龍眼、水蜜桃）不會是「很多胚珠」的那種。"},{"type":"check","id":"g3c3","skill":"由胚珠的數目推出種子的數目，或推出可能是哪一種水果。","variants":[{"stem":"某植物的一朵花，子房裡有 6 個胚珠。如果這 6 個胚珠全部順利受精，這個子房發育成的果實裡，會有幾粒種子？","options":["1 粒","6 粒","0 粒","要看雄蕊有幾個才能決定"],"answer":1,"why":["選這個通常是以為一個子房只變成一粒種子；其實子房變成的是一個果實，種子是裡面的胚珠變的。","正確：子房 → 一個果實；胚珠 → 一粒種子。6 個胚珠全部受精，所以有 6 粒種子，但只有 1 個果實。","選這個通常是以為受精以後只會長出果實、不會有種子；其實受精的胚珠都會變成種子。","選這個是以為種子數由雄蕊決定；種子是由雌蕊子房裡的胚珠變成的，要看胚珠的數目。"],"hints":["先想規則：受精以後，胚珠會變成什麼？","一個胚珠變成一粒種子；現在有 6 個胚珠，而且全部都受精了……"],"solution":["受精以後，胚珠變成種子，子房變成果實。","一個胚珠受精後變成一粒種子。","這個子房裡有 6 個胚珠，而且 6 個都受精了。","6 × 1 ＝ 6，所以果實裡有 6 粒種子。"],"id":"g3c3v1"},{"stem":"西瓜切開，裡面有好幾百粒種子。由此可以推論，西瓜花的雌蕊有什麼特徵？","options":["子房裡只有一個胚珠","一朵花裡有好幾百個子房","子房裡有很多個胚珠","雄蕊的花藥裡有很多花粉"],"answer":2,"why":["選這個是方向想反了；只有一個胚珠的話，最多只會有一粒種子，不可能有好幾百粒。","選這個通常是以為子房會變成種子；其實子房變成果實，一個西瓜就是一個子房變成的。","正確：種子是胚珠變成的，種子有好幾百粒，表示子房裡有很多個胚珠。","選這個是以為種子數由花粉決定；種子是由雌蕊子房裡的胚珠變成的，題目也問的是雌蕊的特徵。"],"hints":["先想：種子是由花的哪一個構造變成的？","一個胚珠最多變成一粒種子；種子有好幾百粒，胚珠至少要有……"],"solution":["受精以後，胚珠變成種子，子房變成果實。","一個西瓜是一個子房變成的果實。","西瓜裡有好幾百粒種子，而一個胚珠最多變成一粒種子。","所以西瓜花的子房裡，至少要有好幾百個胚珠，也就是有很多個胚珠。"],"id":"g3c3v2"},{"stem":"下列哪一種水果，它的花的子房裡最可能「只有一個胚珠」？","options":["芭樂","番茄","西瓜","芒果"],"answer":3,"why":["選這個通常是還沒把胚珠數和種子數連起來；芭樂切開有很多小籽，胚珠一定很多。","選這個通常是還沒用種子數來判斷；番茄切開有很多小籽，胚珠一定很多。","選這個通常是還沒用種子數來判斷；西瓜有好幾百粒種子，胚珠一定很多。","正確：芒果裡只有一粒大種子，所以它最可能只有一個胚珠；其他三種都有很多粒種子，胚珠一定很多，不可能只有一個。"],"hints":["先想規則：胚珠會變成種子，所以「只有一個胚珠」的果實裡，最多會有幾粒種子？","把四種水果在腦中切開來看：哪一種裡面只有一粒種子？"],"solution":["受精以後，胚珠變成種子。","子房裡只有一個胚珠，果實裡最多只有一粒種子。","芭樂、番茄、西瓜切開都有很多粒種子，所以它們的胚珠一定很多，不可能只有一個。","芒果裡只有一粒大種子，所以它最可能只有一個胚珠。","答案是芒果。"],"id":"g3c3v3"}]}]},{"id":"g4","title":"動物：在哪裡受精、在哪裡長大","blocks":[{"type":"key","title":"看到動物的生殖，先把兩個問題分開問","lines":["先認識兩個主角：**精子**是爸爸（雄性）做出來的生殖細胞；**卵**（也叫卵細胞）是媽媽（雌性）做出來的生殖細胞。","所有動物的媽媽都會做卵，包括人。只是鳥的卵很大（雞蛋的蛋黃就是），人的卵很小，眼睛幾乎看不到。","問題一：**受精在哪裡？**受精就是精子和卵結合，變成受精卵。","**體內受精**：精子進到**母體**（媽媽的身體）裡面，在母體內和卵結合。","**體外受精**：精子和卵都排到水裡，在水中結合。","問題二：**胚胎在哪裡長大？養分從哪裡來？**","胚胎＝受精卵開始分裂、慢慢長成小生命的那段時期（例如蛋裡正在長大的小雞）。","**卵生**：胚胎在母體外的卵裡發育，養分來自卵本身的**卵黃**。","卵黃＝卵裡面存養分的部分，雞蛋的蛋黃就是卵黃。","**胎生**：胚胎在母體的**子宮**內發育，養分由母體經過**胎盤**供給。","子宮＝媽媽肚子裡讓胚胎長大的器官；胎盤＝連接媽媽和胚胎、把養分送給胚胎的構造。","兩個問題要各自判斷，不能用其中一個的答案去猜另一個。"]},{"type":"key","title":"常見動物分一分","lines":["受精方式｜生育方式｜動物例子","體內受精｜卵生｜鳥類（紅鶴、雞）、爬蟲類（眼鏡蛇）、昆蟲（獨角仙）","體外受精｜卵生｜大多數魚類（鯉魚）、兩生類（青蛙、面天樹蛙）、珊瑚","體內受精｜胎生｜大多數哺乳類（牛、海豚、蝙蝠、人）"]},{"type":"key","title":"怎麼認出是哪一類？還要小心例外","lines":["有羽毛→鳥類。紅鶴就是粉紅色、常單腳站的火鶴。","有毛、會餵奶→哺乳類。海豚用肺呼吸（會浮上來換氣）、會餵奶；蝙蝠身上有毛、會餵奶，不是鳥。","身上有鱗片、在陸地上產有殼的卵→爬蟲類，例如眼鏡蛇。","小時候在水裡、長大會上岸→兩生類。面天樹蛙是台灣的一種小青蛙。","有六隻腳→昆蟲，例如獨角仙。珊瑚看起來像石頭，其實是動物。","為什麼沒有「體外受精＋胎生」？精子和卵在水裡結合，受精卵已經在媽媽身體外面，沒辦法再回到子宮裡長大。","例外一：**鴨嘴獸**是哺乳類，卻是卵生。","例外二：**孔雀魚**是魚，卵卻留在媽媽身體裡孵化，小魚直接生出來。","所以「哺乳類都是胎生」是錯的，「魚類都是卵生」也是錯的。考試看到「魚類都是卵生」，就想到孔雀魚。","題目出現「都」「均」「一定」「所有」，先停下來想想有沒有例外。"]},{"type":"trap","wrong":"體內受精的動物，一定是胎生。","right":"體內受精只回答「受精在哪裡」；胚胎在哪裡長大要另外判斷。鳥類是體內受精，但是卵生。","reason":"受精是精子遇到卵的那一刻，發育是之後好幾天到好幾個月的事。雞在體內受精以後，會把蛋生出來，小雞在蛋裡長大。所以兩個問題一定要分開問。"},{"type":"example","id":"g4e1","stem":"甲、乙、丙三種動物的生殖方式如下。甲：體外受精、卵生。乙：體內受精、卵生。丙：體內受精、胎生。下列哪一個敘述正確？(A)甲的胚胎在母體子宮內發育　(B)獨角仙的生殖方式和乙相同　(C)鯉魚的生殖方式和丙相同　(D)乙的胚胎發育所需養分由母體經胎盤供給","steps":["先把每一種動物翻成兩個答案：受精在哪裡、胚胎在哪裡長大。","看「甲的胚胎在母體子宮內發育」：甲是卵生，胚胎在母體外的卵裡發育，不在子宮裡，所以這句錯。","看「獨角仙的生殖方式和乙相同」：獨角仙是昆蟲，體內受精、卵生。","乙也是體內受精、卵生，兩者相同，所以這句對。","看「鯉魚的生殖方式和丙相同」：鯉魚是魚類，體外受精、卵生，和甲相同，不是丙，所以這句錯。","看「乙的胚胎發育所需養分由母體經胎盤供給」：乙是卵生，養分來自卵本身的卵黃，不是胎盤，所以這句錯。","只有「獨角仙的生殖方式和乙相同」正確。"],"final":"獨角仙的生殖方式和乙相同"},{"type":"mistake","id":"g4m15","qno":15,"stem":"下列哪一種動物，其卵和精子在母體內結合，但胚胎發育的過程卻是在母體外進行？","options":["面天樹蛙","牛","海豚","紅鶴"],"answer":3,"yours":[2],"think":["很多人會被「海豚住在水裡」騙，你不是一個人；這題要找「卵和精子在母體內結合」（體內受精）而且「胚胎在母體外發育」（卵生）的動物。","所以要找的是「體內受精＋卵生」，兩個條件都要符合。","面天樹蛙是兩生類，在水中體外受精，第一個條件就不符合。","牛和海豚都是哺乳類，雖然是體內受精，但胚胎在子宮裡長大，是胎生，第二個條件不符合。","紅鶴是鳥類，體內受精後把蛋生出來，小鳥在蛋裡長大，兩個條件都符合。","所以答案是 (D) 紅鶴。"],"optionWhy":["面天樹蛙是兩生類，卵和精子在水中結合，是體外受精，第一個條件就不符合。","牛是哺乳類，雖然是體內受精，但胚胎在母體子宮內發育，是胎生。","你可能因為海豚住在水裡，就以為牠的寶寶在外面長大；其實海豚用肺呼吸、會餵寶寶喝奶，是哺乳類，胚胎在媽媽的子宮裡發育，是胎生（住在水裡不等於是魚）。","紅鶴是鳥類，體內受精、卵生，胚胎在母體外的蛋裡發育，完全符合題目。"],"remember":"「母體內受精、母體外發育」＝體內受精＋卵生，先想到鳥類、爬蟲類、昆蟲。"},{"type":"mistake","id":"g4m23","qno":23,"stem":"甲、乙、丙三種動物的生殖方式如右表，關於此表，下列敘述何者正確？\n動物｜受精方式｜生育方式\n甲｜體內受精｜卵生\n乙｜體外受精｜卵生\n丙｜體內受精｜胎生","options":["甲的胚胎發育所需養分來自母體","蝙蝠的生殖方式和甲相同","青蛙的生殖方式和乙相同","丙的胚胎發育所需養分來自卵本身"],"answer":2,"yours":[1],"think":["選蝙蝠的人很多，別灰心；這題要先把甲、乙、丙各翻成「受精在哪裡＋胚胎在哪裡長大、養分從哪裡來」。","甲＝體內受精＋卵生，養分來自卵黃；乙＝體外受精＋卵生，養分也來自卵黃；丙＝體內受精＋胎生，養分由母體經胎盤供給。","(A) 甲是卵生，養分來自卵黃，不是母體，錯；(D) 丙是胎生，養分來自胎盤，不是卵本身，也錯。","(B) 蝙蝠會飛，但牠有毛、會餵奶，是哺乳類，和丙一樣是胎生，不是甲，錯。","(C) 青蛙是兩生類，在水中體外受精、卵生，和乙一樣，對。","所以答案是 (C)。"],"optionWhy":["甲是卵生，胚胎在母體外的卵裡發育，養分來自卵本身的卵黃，不是來自母體。","你可能想到蝙蝠會飛，就把牠和鳥類放在一起；其實蝙蝠身上有毛、會餵奶，是哺乳類，體內受精、胎生，和丙相同，不是甲。","青蛙在水中體外受精、卵生，和乙完全相同，所以這個敘述正確。","丙是胎生，胚胎在子宮內發育，養分由母體經過胎盤供給，不是來自卵本身。"],"remember":"蝙蝠會飛、海豚住水裡，但牠們都是哺乳類（胎生）；分類要看「是哪一類動物」，不是看會不會飛、住在哪裡。"},{"type":"check","id":"g4c1","skill":"依照受精方式和生育方式，判斷是哪一種動物","variants":[{"stem":"下列哪一種動物是「體外受精、卵生」？","options":["鯉魚","眼鏡蛇","雞","海豚"],"answer":0,"why":["對！鯉魚是魚類，精子和卵排到水中結合，受精卵在水中發育。","選這個通常是以為「卵生」就一定是體外受精；眼鏡蛇是爬蟲類，其實是體內受精。","選這個通常是把「蛋生在外面」當成「體外受精」；雞的精子和卵在媽媽體內就結合了，受精後才把蛋生出來。","選這個通常是因為海豚住在水裡；海豚用肺呼吸、會餵奶，是哺乳類，體內受精、胎生。"],"hints":["先分開判斷兩件事：受精在體內還是體外？胚胎在母體內還是母體外長大？注意：「蛋生在外面」是生育方式，「精子和卵在哪裡結合」才是受精方式。","雞蛋生出來之前，在媽媽肚子裡就已經受精了。想一想：哪一類動物會把精子和卵排到水裡結合？"],"solution":["體外受精＋卵生的常見動物：大多數魚類、兩生類、珊瑚。","眼鏡蛇（爬蟲類）和雞（鳥類）：體內受精＋卵生。","海豚（哺乳類）：體內受精＋胎生。","鯉魚是魚類，體外受精＋卵生，所以答案是鯉魚。"],"id":"g4c1v1"},{"stem":"某種動物的精子在母體內和卵結合，胚胎在母體子宮內發育，養分由胎盤供給。下列哪一種動物符合這樣的生殖方式？","options":["蝙蝠","紅鶴","獨角仙","面天樹蛙"],"answer":0,"why":["對！蝙蝠有毛、會餵奶，是哺乳類，體內受精、胎生，胚胎靠胎盤得到養分。","選這個通常是以為體內受精就一定是胎生；紅鶴是鳥類，體內受精，但是卵生。","選這個通常是只看了「體內受精」；獨角仙是昆蟲，會產卵，是卵生。","選這個通常是把兩生類想成和哺乳類一樣；面天樹蛙是體外受精、卵生。"],"hints":["「子宮」「胎盤」這兩個詞告訴你：這是胎生。","胎生的動物大多是哺乳類；想想選項裡哪一個有毛、會餵奶，不要被「會飛」騙了。"],"solution":["精子在母體內和卵結合：體內受精。","胚胎在子宮內發育、養分由胎盤供給：胎生。","體內受精＋胎生：大多數哺乳類。","紅鶴是鳥類、獨角仙是昆蟲，都是卵生；面天樹蛙是體外受精、卵生。","蝙蝠有毛、會餵奶，是哺乳類，所以答案是蝙蝠。"],"id":"g4c1v2"},{"stem":"下列哪一組動物，「受精方式」和「生育方式」兩項都相同？","options":["雞和獨角仙","雞和牛","鯉魚和眼鏡蛇","青蛙和海豚"],"answer":0,"why":["對！雞和獨角仙都是體內受精、卵生，兩項都相同。","選這個通常是只比了受精方式；兩者都是體內受精，但雞是卵生、牛是胎生。","選這個通常是只比了生育方式；兩者都是卵生，但鯉魚是體外受精、眼鏡蛇是體內受精。","選這個通常是因為兩者都和水有關；青蛙是體外受精、卵生，海豚是體內受精、胎生，兩項都不同。"],"hints":["把每一種動物都寫成「受精方式＋生育方式」兩個答案，再一組一組比。","雞是體內受精＋卵生，牛是體內受精＋胎生；其他動物也照這樣寫下來，兩項都一樣才算。"],"solution":["雞：體內受精＋卵生。獨角仙（昆蟲）：體內受精＋卵生。兩項都相同。","牛：體內受精＋胎生，生育方式和雞不同。","鯉魚：體外受精＋卵生；眼鏡蛇：體內受精＋卵生，受精方式不同。","青蛙：體外受精＋卵生；海豚：體內受精＋胎生，兩項都不同。","所以答案是雞和獨角仙。"],"id":"g4c1v3"}]},{"type":"p","text":"注意：胎生動物也有卵！胎生動物的媽媽也會做卵細胞，卵細胞留在媽媽身體裡受精，然後在子宮裡長大。下面表格比的「卵的大小」，是指還沒開始長大之前的那顆卵細胞，不是生出來的寶寶。"},{"type":"key","title":"卵生和胎生比一比","lines":["比較項目｜卵生｜胎生","受精卵在哪裡發育｜母體外｜母體內（子宮）","胚胎的養分從哪裡來｜卵本身的卵黃｜母體經胎盤供給","卵的大小｜通常較大｜很小","親代（爸爸媽媽）的保護｜通常較少｜較多","一次產卵（生）的數量｜通常較多｜通常較少","例子｜鳥類、爬蟲類、大多數魚類｜大多數哺乳類"]},{"type":"why","title":"想知道為什麼？","lines":["卵生的胚胎離開媽媽以後，就拿不到媽媽的養分了。","所以卵裡要先裝好整段發育需要的養分；卵黃多，卵就比較大。","胎生的胚胎一直在子宮裡，可以透過胎盤從媽媽身上拿養分。","所以胎生的卵不用帶很多養分。人的卵細胞大約只有 0.1 毫米，比一粒鹽還小；雞蛋的蛋黃卻有好幾公分。","很多卵生動物（例如大多數魚類、青蛙）把卵產在外面後就不照顧，卵很容易被吃掉或死掉；產得多，才有機會留下後代。","親代保護得越好，每個孩子活下來的機會越高，就不需要產那麼多。"]},{"type":"mistake","id":"g4m17","qno":17,"stem":"有關胎生與卵生的比較，下列何者錯誤？\n選項｜胎生｜卵生\n(A)｜受精卵在母體內發育｜受精卵在母體外發育\n(B)｜養分由母體供給｜養分由卵本身供給\n(C)｜卵較小｜卵較大\n(D)｜哺乳類均為胎生｜魚類均為卵生","options":["見表 (A) 列","見表 (B) 列","見表 (C) 列","見表 (D) 列"],"answer":3,"yours":[2],"think":["很多人會被「胎兒那麼大」騙，沒關係；這題要找的是「錯誤」的那一列，所以每一列都要檢查。","(A) 列和 (B) 列：胎生在子宮內發育、養分由母體供給；卵生在母體外發育、養分來自卵黃，兩列都對。","(C) 列：胎生動物也有卵，比的是一開始那顆卵細胞；卵生的卵要裝卵黃所以較大，胎生的卵靠母體給養分所以很小，這列也對。","(D) 列的「均」就是「都」：鴨嘴獸是哺乳類卻是卵生，孔雀魚是魚卻在母體內孵化，所以這列說錯了。","所以答案是 (D)。"],"optionWhy":["這一列正確：胎生的胚胎在子宮裡長大，卵生的胚胎在母體外的卵裡長大。","這一列正確：胎生靠胎盤從母體拿養分，卵生靠卵裡的卵黃。","這題要找「說錯的」那一列；你選 (C)，代表你覺得 (C) 說錯了。可是 (C) 其實是對的：胎生動物的卵很小，因為之後養分靠媽媽慢慢給；卵生動物的卵要先裝滿卵黃，所以比較大。寶寶生出來很大，不代表一開始的卵很大。","「均」就是「都」；鴨嘴獸是卵生的哺乳類，孔雀魚的卵在母體內孵化，所以這一列是錯的，就是答案。"],"remember":"選項出現「均」「都」「一定」，先想有沒有例外：鴨嘴獸（卵生的哺乳類）、孔雀魚（卵在母體內孵化的魚）。"},{"type":"check","id":"g4c2","skill":"比較卵生和胎生，找出錯誤的敘述（小心「都」「一定」）","variants":[{"stem":"下列有關卵生和胎生的敘述，哪一個是錯誤的？","options":["所有哺乳類都是胎生","卵生動物胚胎發育的養分，來自卵本身的卵黃","胎生動物的卵，通常比卵生動物的卵小","胎生動物的胚胎在母體子宮內發育"],"answer":0,"why":["對！這句用了「所有」「都」，但鴨嘴獸是哺乳類卻是卵生，所以這句錯。","選這個通常是把卵生和胎生的養分來源記反；卵生的養分確實來自卵黃，這句是對的。","選這個通常是以為胎兒很大、卵也很大；其實胎生的卵很小，因為養分靠母體供給，這句是對的。","選這個通常是對「子宮」這個詞不熟；胎生的胚胎就是在子宮裡長大，這句是對的。"],"hints":["這題要找「錯誤」的敘述；先注意有沒有「都」「所有」「一定」這種說法。","有「所有」的那一句，想想看：有沒有哪一種哺乳類是生蛋的？"],"solution":["卵生的養分來自卵黃：對。","胎生的卵小、卵生的卵大：對。","胎生的胚胎在子宮內發育：對。","「所有哺乳類都是胎生」：鴨嘴獸是哺乳類卻是卵生，所以錯。","答案是「所有哺乳類都是胎生」。"],"id":"g4c2v1"},{"stem":"下列有關動物生殖的敘述，哪一個是錯誤的？","options":["魚類都是卵生","鳥類是體內受精，但屬於卵生","親代保護越多的動物，產卵數通常越少","胎生動物胚胎的養分，由母體經過胎盤供給"],"answer":0,"why":["對！孔雀魚的卵在母體內孵化，小魚直接生出來，所以「魚類都是卵生」錯。","選這個通常是以為體內受精就一定是胎生；鳥類真的是體內受精、卵生，這句是對的。","選這個通常是以為產越多越好；其實親代保護得好，孩子活下來的機會高，就不用產那麼多，這句是對的。","選這個通常是不確定胎盤的功能；胎盤就是把母體養分送給胚胎的構造，這句是對的。"],"hints":["先找有沒有用「都」的句子，再想它有沒有例外。","大多數魚把卵產在水裡；但有沒有一種魚，卵是留在媽媽肚子裡孵化的？"],"solution":["鳥類是體內受精、卵生：對。","親代保護越多，產卵數通常越少：對。","胎生的養分由母體經胎盤供給：對。","「魚類都是卵生」：孔雀魚的卵在母體內孵化，是例外，所以錯。","答案是「魚類都是卵生」。"],"id":"g4c2v2"},{"stem":"下列有關動物生殖的敘述，哪一個是錯誤的？","options":["體內受精的動物一定是胎生","鴨嘴獸是哺乳類，但是卵生","卵生動物的卵通常比較大，因為裡面儲存較多養分","鯉魚一次產下的卵，通常比牛一次生下的小牛多"],"answer":0,"why":["對！鳥類、爬蟲類、昆蟲都是體內受精，卻是卵生，所以「一定是胎生」錯。","選這個通常是記得「哺乳類是胎生」，就覺得這句怪；鴨嘴獸正是那個例外，這句是對的。","選這個通常是把卵生和胎生的卵大小記反；卵生的卵要裝卵黃，所以比較大，這句是對的。","選這個通常是沒想到親代保護的差別；鯉魚產卵後不照顧，一次產很多，牛懷孕保護胎兒，一次多半只生一隻，這句是對的。"],"hints":["看到「一定」，先想有沒有例外。","想一想：雞是體內受精，牠是把蛋生出來，還是把小雞直接生出來？"],"solution":["鴨嘴獸是卵生的哺乳類：對。","卵生的卵要裝卵黃，所以通常較大：對。","鯉魚不照顧卵，產卵數多；牛保護胎兒，生得少：對。","「體內受精一定是胎生」：雞是體內受精，卻是卵生，所以錯。","答案是「體內受精的動物一定是胎生」。"],"id":"g4c2v3"}]},{"type":"key","title":"先認識雞蛋","lines":["打開一顆雞蛋：**蛋黃加上蛋黃上面的小白點**，才是媽媽**卵巢**做出來的那一個卵細胞（很大的一個細胞！）。","卵巢＝製造卵細胞的器官；**輸卵管**＝卵細胞離開卵巢以後經過的管子。","蛋白、蛋殼是後來在輸卵管裡一層一層包上去的，不是卵細胞的一部分。","可以這樣想：卵巢像工廠，做出蛋黃（上面有胚盤）；輸卵管像包裝線，蛋黃一邊往前走，一邊被包上繫帶、蛋白，最後包上蛋殼。","**細胞核**：細胞裡面像「指揮中心」的地方，裝著長成一隻小雞的設計圖。","只有有設計圖的部分才能長成小雞，所以會變成胚胎的是有細胞核的胚盤；卵黃是食物，沒有設計圖。"]},{"type":"key","title":"鳥蛋的構造","lines":["構造｜打蛋時看到的樣子｜從哪裡來｜功能","胚盤｜蛋黃上面那個小白點｜卵巢（卵細胞的一部分）｜有細胞核，受精後會發育成胚胎","卵黃（蛋黃）｜圓圓黃黃的一大團｜卵巢（卵細胞的一部分）｜儲存養分，是胚胎主要的養分來源","繫帶｜黏在蛋黃兩旁、白白一條像線的東西｜輸卵管｜把卵黃固定在蛋的中間","卵白（蛋白）｜包住蛋黃、透明會流動的部分｜輸卵管｜提供水分和部分養分，並有保護作用（主要養分仍來自卵黃）","卵殼｜最外面硬硬的殼｜輸卵管｜保護裡面的構造；殼上有許多小孔，可讓氣體進出，供胚胎呼吸"]},{"type":"trap","wrong":"錯誤想法 1：蛋黃、蛋白都是卵巢做的。錯誤想法 2：提供胚胎「主要」養分的是胚盤或卵白。","right":"對想法 1：只有卵黃和胚盤是卵巢做的（卵細胞的一部分）；卵白、卵殼在輸卵管形成。對想法 2：胚盤會變成胚胎，卵黃才是胚胎的主要養分來源（卵白主要提供水分，也含少量養分）。","reason":"記法：胚盤＝小雞本人，卵黃＝小雞的便當，卵白＝水壺加棉被。工廠（卵巢）只做小雞本人和便當；水壺、棉被和外殼，是包裝線（輸卵管）加上去的。"},{"type":"mistake","id":"g4m32","qno":32,"stem":"圖(一)為某一鳥類未受精的蛋剖面圖。圖(一)的哪一構造是由卵巢所產生，可以供給胚胎發育時所需的養分？","options":["甲","乙","丙","丁"],"answer":1,"yours":[0],"fig":"egg","figText":"（圖(一)：甲指著蛋黃頂端的一個小白點；乙指著圓圓的蛋黃本身；丙指著從蛋黃連到兩端、扭轉的帶子；丁的線指到蛋的外圈（卵白和卵殼那一帶）。）","think":["蛋的構造名字很多，卡住很正常；這題有兩個條件：「由卵巢所產生」和「供給胚胎發育所需的養分」，兩個都要符合。","先對照圖：甲是胚盤、乙是卵黃、丙是繫帶；丁的線指到蛋的外圈，是卵白和卵殼那一帶。","卵巢做出的卵細胞只有卵黃和上面的胚盤；丙繫帶、丁（卵白、卵殼）都是在輸卵管包上去的，先刪掉。","甲胚盤有細胞核（設計圖），受精後會變成胚胎，它是「小雞本人」，不是提供養分的部分。","乙卵黃儲存大量養分，是胚胎主要的養分來源，兩個條件都符合。","所以答案是 (B) 乙。"],"optionWhy":["你可能記得胚盤來自卵巢，這一點是對的；只差一點：胚盤的工作是受精後發育成胚胎，提供養分的是它下面的卵黃（胚盤＝小雞本人，卵黃＝小雞的便當，卵白＝水壺加棉被）。","乙是卵黃，是卵巢產生的卵細胞的一部分，儲存養分供給胚胎發育，兩個條件都符合。","丙是繫帶，在輸卵管形成，作用是固定卵黃，不負責提供養分。","丁指的是蛋的外圈（卵白和卵殼那一帶），都是在輸卵管才包上去的，不是卵巢產生的；卵白雖然能提供水分和少量養分，但不是主要的養分來源。"],"remember":"卵巢只做卵黃和胚盤：胚盤長成胚胎，卵黃是胚胎的便當；卵白、繫帶、卵殼是輸卵管加上去的。"},{"type":"check","id":"g4c3","skill":"分清楚鳥蛋各構造的來源和功能","variants":[{"stem":"鳥蛋的構造中，受精後會發育成胚胎的是哪一個？","options":["胚盤","卵黃","繫帶","卵白"],"answer":0,"why":["對！胚盤有細胞核，受精後會發育成胚胎。","選這個通常是把「提供養分」和「變成胚胎」搞混；卵黃是胚胎的養分，不會變成胚胎。","選這個通常是以為連在卵黃上的帶子是胚胎的一部分；繫帶只負責固定卵黃。","選這個通常是以為整團蛋白會長成小雞；卵白的功能是提供水分、部分養分和保護。"],"hints":["要變成胚胎，需要有細胞核（裝著設計圖）的部分。","有細胞核的構造在卵黃表面，是一個小白點。"],"solution":["胚胎是由受精卵發育來的，需要有細胞核裡的設計圖。","卵黃表面的小白點叫胚盤，裡面有細胞核。","卵黃提供養分，繫帶固定卵黃，卵白提供水分、部分養分和保護。","所以受精後發育成胚胎的是胚盤。"],"id":"g4c3v1"},{"stem":"雞蛋的構造中，哪一個是在輸卵管形成，並且可以提供胚胎水分、保護胚胎？","options":["卵白","卵黃","胚盤","繫帶"],"answer":0,"why":["對！卵白在輸卵管形成，提供水分並保護胚胎。","選這個通常是以為整顆蛋都在輸卵管做好；卵黃是卵巢產生的，提供的是主要養分。","選這個通常是把來源記反；胚盤來自卵巢，受精後發育成胚胎。","選這個通常是只想到它在卵黃外面；繫帶的功能是固定卵黃，不是提供水分。"],"hints":["先用「在輸卵管形成」刪掉卵巢產生的構造。","卵巢產生的是卵黃和胚盤；剩下的構造裡，哪一個是透明、包住卵黃的一大圈？"],"solution":["卵黃和胚盤由卵巢產生，不符合「在輸卵管形成」。","繫帶在輸卵管形成，但功能是固定卵黃。","卵白在輸卵管形成，功能是提供水分、部分養分和保護胚胎。","所以答案是卵白。"],"id":"g4c3v2"},{"stem":"下列有關鳥蛋構造的敘述，哪一個正確？","options":["卵黃和胚盤都由卵巢產生，是卵細胞的一部分","卵白由卵巢產生，提供胚胎主要的養分","繫帶在受精後會發育成胚胎","卵殼和卵黃都是在輸卵管形成的"],"answer":0,"why":["對！卵巢產生卵細胞，卵黃和胚盤都是卵細胞的一部分。","選這個通常是把卵白和卵黃搞混；卵白在輸卵管形成，主要養分來自卵黃。","選這個通常是以為連著卵黃的帶子會長成小雞；發育成胚胎的是胚盤，繫帶只固定卵黃。","選這個通常是以為整顆蛋都在輸卵管做好；卵殼在輸卵管形成，但卵黃是卵巢產生的。"],"hints":["先把構造分成兩組：卵巢產生的、輸卵管形成的。","卵巢產生的只有卵細胞那一部分；想想卵細胞包含哪兩個構造。"],"solution":["卵巢產生卵細胞：包括卵黃和胚盤。","輸卵管形成：繫帶、卵白、卵殼。","卵白在輸卵管形成，主要養分來自卵黃，所以「卵白由卵巢產生，提供胚胎主要的養分」錯。","發育成胚胎的是胚盤，不是繫帶；卵黃也不是輸卵管形成的。","所以正確的是「卵黃和胚盤都由卵巢產生，是卵細胞的一部分」。"],"id":"g4c3v3"}]}]}],"exam":[{"type":"r01","section":"g1","title":"對與條、2n與n","variants":[{"stem":"某種動物的體細胞（身體一般的細胞，例如皮膚細胞）中有 12 對染色體。下列哪一組描述，正確說出這種動物的體細胞、精子和受精卵的染色體？","options":["體細胞 24 條・成對／精子 12 條・不成對／受精卵 24 條・成對","體細胞 12 條・成對／精子 6 條・不成對／受精卵 12 條・成對","體細胞 24 條・成對／精子 12 條・成對／受精卵 24 條・成對","體細胞 24 條・成對／精子 12 條・不成對／受精卵 48 條・成對"],"answer":0,"why":["正確：12 對＝24 條；精子由減數分裂（產生精子和卵的分裂，染色體數目會變一半）產生，只剩 12 條，而且每對只留一條，所以不成對；受精卵是 12＋12＝24 條，又配成對。","選這個通常是把「12 對」當成「12 條」；1 對其實是 2 條，就像 12 雙筷子是 24 支，所以體細胞是 24 條。","選這個通常是以為精子的染色體也成對；減數分裂（產生精子和卵的分裂）把每一對拆開，精子只拿到每對中的一條，所以不成對。","選這個通常是把兩個體細胞的數目相加；受精是精子 12 條加卵 12 條，所以受精卵是 24 條，不是 48 條。"],"hints":["「對」就像「雙」：12 雙筷子＝24 支筷子，所以 12 對染色體＝24 條。精子是由「減數分裂」產生的，這種分裂會讓染色體數目變成一半。","體細胞 24 條＝兩套，寫成 2n（n 代表一套）。精子只有一套 n，是幾條？每雙筷子只拿走一支，還湊得成雙嗎？"],"solution":["第一步，先換單位：1 對＝2 條，所以 12 對＝12 × 2＝24 條。「對」就像「雙」，12 雙筷子就是 24 支筷子。","「成對」的意思是：同一種染色體有兩條，大小形狀一樣，一條來自爸爸、一條來自媽媽。體細胞的染色體都是成對的。","n 代表「一套」染色體，也就是每一種染色體各拿一條。體細胞每種都有兩條，所以是兩套，寫成 2n。這裡 2n＝24 條，所以一套 n＝12 條。","第二步，精子由減數分裂產生。減數分裂：產生精子和卵的分裂，會讓染色體數目變成一半。","減數分裂把每一對拆開，精子只拿到每對中的一條。所以精子有 24 ÷ 2＝12 條，也就是 n＝12。就像每雙筷子只拿走一支，湊不成雙，所以不成對。","第三步，受精時精子 12 條＋卵 12 條＝24 條。爸爸來的一條和媽媽來的一條又配成一對，所以受精卵 24 條、成對。","細胞｜條數｜成對嗎？\n體細胞｜24 條｜成對\n精子｜12 條｜不成對\n受精卵｜24 條｜成對","「對」和「條」是這單元最常搞混的地方，很多人都卡在這裡。弄懂這一個，後面好幾題就都會了。"],"id":"r01v1"},{"stem":"某種植物的葉肉細胞（葉子裡的細胞，屬於體細胞）中有 7 對染色體。這種植物的花裡有子房（雌蕊下方鼓起來的部分），子房裡有胚珠（小顆粒，以後會變成種子），胚珠中有卵細胞。請問卵細胞，以及受精後的受精卵，染色體的情形分別為何？","options":["卵細胞 7 條・不成對／受精卵 14 條・成對","卵細胞 7 對・成對／受精卵 14 對・成對","卵細胞 7 條・成對／受精卵 14 條・成對","卵細胞 14 條・不成對／受精卵 28 條・成對"],"answer":0,"why":["正確：7 對＝14 條；卵細胞由減數分裂產生，剩一半，是 7 條且不成對；受精卵是 7＋7＝14 條，又成對，和葉肉細胞一樣。","選這個通常是以為卵細胞和葉肉細胞一樣多，又把受精想成再加倍；其實卵細胞要先減半，受精後才回到 7 對。","選這個通常是以為卵細胞的染色體也成對；減數分裂把每一對拆開，卵細胞每對只拿到一條，所以不成對。","選這個通常是把 7 對換成 14 條後，還沒想到減數分裂要減半這一步；卵細胞是 14 ÷ 2＝7 條。"],"hints":["葉肉細胞是體細胞，染色體成對。卵細胞是由減數分裂產生的，染色體數目會變成一半。","葉肉細胞 7 對＝14 條。卵細胞是 14 ÷ 2＝幾條？每對只剩一條，還會成對嗎？受精卵是精細胞（植物的精子）加上卵細胞。"],"solution":["第一步，換單位：葉肉細胞 7 對＝7 × 2＝14 條。這是兩套，寫成 2n＝14。","第二步，卵細胞由減數分裂產生。減數分裂會讓染色體數目變成一半。","所以卵細胞有 14 ÷ 2＝7 條，也就是一套，n＝7。每一對只分到一條，所以不成對。","第三步，植物的「精子」叫做精細胞，藏在花粉裡。花粉會長出一條細管（花粉管），把精細胞送到卵細胞旁邊。","精細胞也是由減數分裂產生的，所以也是 7 條。受精時 7 條＋7 條＝14 條。","這 14 條中，每一種都有一條來自精細胞、一條來自卵細胞，所以又配成 7 對。","結論：卵細胞 7 條、不成對；受精卵 14 條、成對（7 對），和葉肉細胞一樣。"],"id":"r01v2"}]},{"type":"r02","section":"g1","title":"細胞分裂次數","variants":[{"stem":"某生物的體細胞中有 6 對染色體。一個體細胞連續進行 4 次細胞分裂後，共得到 X 個細胞，每個細胞有 Y 條染色體。X＋Y 等於多少？","options":["28","22","20","16"],"answer":0,"why":["正確：細胞數 1→2→4→8→16，X＝16；細胞分裂不改變染色體數，Y＝6 × 2＝12 條；16＋12＝28。","選這個通常是把 Y 算成 6：可能把「6 對」當成「6 條」，或以為細胞分裂會讓染色體減半，16＋6＝22；其實每個細胞仍有 12 條。","選這個通常是把細胞數算成 2 × 4＝8，再加 12 條得到 20；其實每次都乘以 2，要乘 4 次：2 × 2 × 2 × 2＝16。","選這個通常是以為分裂 4 次就是 4 個細胞，4＋12＝16；其實每分裂一次，所有細胞都各自分成兩個，4 次後是 16 個。"],"hints":["分兩件事算：每分裂一次，所有的細胞都各自分成兩個，細胞數乘以 2；分裂後每個細胞的染色體數和原來一樣。","X：1 個細胞分裂 1 次變 2 個，2 次變 4 個，3 次變幾個？4 次呢？Y：6 對要先換成條。"],"solution":["第一步，算細胞數 X。細胞分裂：一個細胞分成兩個。每分裂一次，「所有」的細胞都各自分成兩個，所以細胞數變成 2 倍。","就像一張紙對折再對折，每折一次，層數都變兩倍。","1 個 → 第 1 次 2 個 → 第 2 次 4 個 → 第 3 次 8 個 → 第 4 次 16 個。所以 X＝2 × 2 × 2 × 2＝16。","第二步，算染色體數 Y。分裂後得到的新細胞叫做子細胞。細胞分裂前，染色體會先複製一份，再平均分給兩個子細胞，所以子細胞的染色體數和原來一樣。","原來有 6 對＝6 × 2＝12 條，所以每個子細胞都是 12 條，Y＝12。","第三步，X＋Y＝16＋12＝28。X＋Y 只是把兩個答案合成一個數字方便出題，沒有特別意義。"],"id":"r02v1"},{"stem":"某細胞中有 9 對染色體。它連續進行細胞分裂後，總共得到 32 個細胞。這個細胞一共分裂了幾次？每個子細胞（分裂後得到的新細胞）有幾條染色體？","options":["分裂 5 次；每個細胞有 18 條","分裂 16 次；每個細胞有 18 條","分裂 5 次；每個細胞有 9 條","分裂 4 次；每個細胞有 18 條"],"answer":0,"why":["正確：1→2→4→8→16→32，一共加倍 5 次；細胞分裂不改變染色體數，9 對＝18 條。","選這個通常是用 32 ÷ 2 算次數；細胞數是每次乘以 2，要找「2 連乘幾次會等於 32」。","選這個通常是以為細胞分裂會讓染色體減半，或把「9 對」當成「9 條」；子細胞和原來一樣有 18 條。","選這個通常是數加倍次數時少算一次：分裂 4 次只有 16 個細胞，還要再分裂一次才有 32 個。"],"hints":["細胞分裂每一次，所有細胞都各自分成兩個，細胞數變成 2 倍；而每個子細胞的染色體數和原來的細胞一樣。","從 1 開始一直乘以 2：1→2→4→8→16→32，數一數箭頭有幾個。染色體數只要把 9 對換成條。"],"solution":["第一步，找分裂次數。每分裂一次，所有細胞都各自分成兩個，細胞數就乘以 2。","從 1 個開始：1→2（第 1 次）→4（第 2 次）→8（第 3 次）→16（第 4 次）→32（第 5 次）。","所以要分裂 5 次，才會有 32 個細胞。也可以這樣檢查：2 × 2 × 2 × 2 × 2＝32。","第二步，找染色體數。細胞分裂會先把染色體複製一份，再平均分給兩個子細胞，所以數目不變。","原來有 9 對＝9 × 2＝18 條，所以每個子細胞也是 18 條。","結論：分裂 5 次；每個細胞有 18 條。"],"id":"r02v2"}]},{"type":"r03","section":"g1","title":"兩種分裂比較","variants":[{"stem":"某動物的體細胞有 8 對染色體（16 條，也就是兩套，寫成 2n＝16）。關於這種動物的細胞分裂和減數分裂，下列敘述何者正確？（子細胞：分裂後得到的新細胞）","options":["一個細胞完成減數分裂後，產生 4 個子細胞，每個有 8 條染色體、不成對","一個細胞完成一次細胞分裂後，產生 2 個子細胞，每個有 8 條染色體","一個細胞完成減數分裂後，產生的子細胞中，染色體仍然兩兩成對","皮膚受傷後長出新細胞來修補傷口，是靠減數分裂"],"answer":0,"why":["正確：減數分裂讓 1 個細胞變成 4 個子細胞，染色體減半成 16 ÷ 2＝8 條，而且每對只剩一條，所以不成對。","選這個通常是把細胞分裂和減數分裂記反；細胞分裂產生的 2 個子細胞，染色體數不變，仍是 16 條。","選這個通常是以為子細胞的染色體一定成對；減數分裂把每一對拆開，子細胞每對只拿到一條。","選這個通常是把兩種分裂的用途記反；修補傷口要的是一模一樣的新細胞，靠的是細胞分裂。"],"hints":["先分清楚：細胞分裂讓身體長大、修補，染色體數不變；減數分裂產生精子和卵，染色體數減半。","減數分裂：1 個細胞變幾個？16 條減半是幾條？每一對被拆開後，還成對嗎？再逐一檢查每個敘述。"],"solution":["先想減數分裂為什麼產生 4 個：它會連續分兩次，1 個 → 2 個 → 4 個。但染色體只複製一次，所以每個子細胞只分到一半。","整理兩種分裂（以 2n＝16 為例）：","項目｜細胞分裂｜減數分裂\n一個細胞產生幾個子細胞｜2 個｜4 個\n每個子細胞的染色體｜16 條｜8 條\n成不成對｜成對｜不成對\n用途｜生長、修補傷口｜產生精子和卵","檢查「減數分裂產生 4 個子細胞，每個 8 條、不成對」：和表格相符，正確。","檢查「細胞分裂後每個子細胞 8 條」：細胞分裂不改變數目，應該是 16 條，錯誤。","檢查「減數分裂後的子細胞仍成對」：減數分裂把每一對拆開，應該不成對，錯誤。","檢查「修補傷口靠減數分裂」：修補傷口靠細胞分裂，錯誤。","所以正確的是：減數分裂產生 4 個子細胞，每個 8 條、不成對。"],"id":"r03v1"},{"stem":"人的體細胞有 23 對染色體。關於人體內的細胞分裂和減數分裂，下列敘述何者「錯誤」？","options":["減數分裂產生的精子或卵，含有 23 對染色體","受精卵發育成胎兒時，細胞數目增加是靠細胞分裂","皮膚細胞進行細胞分裂後，每個子細胞有 46 條染色體，而且成對","減數分裂發生在睪丸和卵巢中，用來產生精子和卵"],"answer":0,"why":["這句是錯的，所以要選它：精子和卵只有 46 ÷ 2＝23 條，每對只剩一條，不能說成「23 對」。","選這個通常是記反了兩種分裂的用途；這句其實正確，胚胎長大要的是一模一樣的細胞，靠細胞分裂增加數目。","選這個通常是以為細胞分裂也會減半；這句其實正確，細胞分裂後染色體數不變，仍是 46 條、成對。","選這個通常是不確定減數分裂在哪裡發生；這句其實正確，精子在睪丸、卵在卵巢由減數分裂產生。"],"hints":["題目問「錯誤」的敘述。特別注意每個敘述用的是「對」還是「條」。","23 對＝46 條。減數分裂後數目減半，是 23 條還是 23 對？這兩個說法差多少？"],"solution":["第一步，換單位：人的體細胞 23 對＝23 × 2＝46 條。","第二步，細胞分裂：子細胞（分裂後得到的新細胞）和原來一樣是 46 條、成對，用在生長和修補。所以「受精卵長成胎兒靠細胞分裂」正確，「皮膚細胞分裂後每個 46 條、成對」也正確。","第三步，減數分裂在睪丸和卵巢中進行，產生精子和卵。所以「發生在睪丸和卵巢」正確。","第四步，減數分裂後染色體減半：46 ÷ 2＝23 條。每一對只留一條，所以不成對。","「23 對」等於 46 條，和體細胞一樣多，這就沒有減半了。所以「精子或卵含有 23 對染色體」是錯的。","答案就是這一句：應該改成「23 條」才對。"],"id":"r03v2"}]},{"type":"r04","section":"g1","title":"受精的意義","variants":[{"stem":"貓爸爸、貓媽媽（親代：爸爸媽媽那一代）的體細胞都有 38 條染色體。關於貓的精子、卵和受精卵，下列敘述何者正確？","options":["精子和卵各有 19 條，受精卵有 38 條，和親代體細胞一樣多","精子和卵各有 38 條，受精卵有 76 條，比親代多一倍","精子有 19 條、卵有 38 條，受精卵有 57 條","受精卵的 38 條染色體全部來自卵，精子只負責刺激卵開始發育"],"answer":0,"why":["正確：精子和卵都由減數分裂產生，各是 38 ÷ 2＝19 條；受精後 19＋19＝38 條，回到和親代一樣。","選這個通常是還沒想到精子和卵要先減半這一步；如果不減半，受精卵是 38＋38＝76 條，下一代 152 條、再下一代 304 條，越來越多，但貓每一代都是 38 條。","選這個通常是以為卵比較大，染色體也比較多；其實卵大是因為多裝了養分（像便當盒比較大，是因為多裝了飯），染色體和精子一樣是 19 條。","選這個通常是以為受精只是「叫醒」卵；其實受精卵的染色體一半來自精子、一半來自卵。"],"hints":["受精：精子和卵結合成受精卵。先想精子和卵各有幾條，再相加。","精子和卵都經過減數分裂，各是 38 的一半。兩個加起來，會不會和親代一樣？"],"solution":["第一步，精子和卵都是由減數分裂產生的。減數分裂會讓染色體數目變成一半。","所以精子有 38 ÷ 2＝19 條，卵也有 38 ÷ 2＝19 條。卵雖然比較大，染色體數目和精子一樣。","第二步，受精時精子和卵結合：19＋19＝38 條。","第三步，38 條和親代體細胞一樣多。這 38 條中，一半來自爸爸（精子），一半來自媽媽（卵）。","這就是受精的意義：讓受精卵的染色體數目回到和親代一樣，而且同時帶有爸爸和媽媽的遺傳物質。","結論：精子和卵各 19 條，受精卵 38 條，和親代一樣多。"],"id":"r04v1"},{"stem":"某種植物的體細胞是 2n＝20。n 代表「一套」染色體，就像一副撲克牌每種牌各一張；2n 就是兩副。\n胚珠是花裡會變成種子的小顆粒；胚是種子裡面會長成小植物的部分。\n請判斷下面四種細胞各有幾套：①花粉管中的精細胞 ②胚珠中的卵細胞 ③受精卵 ④種子裡胚的細胞。依序為何？","options":["n、n、2n、2n","2n、2n、4n、4n","n、2n、3n、3n","n、n、2n、n"],"answer":0,"why":["正確：精細胞和卵細胞由減數分裂產生，各一套 n；受精後 n＋n＝2n；胚是受精卵經細胞分裂長成的，仍是 2n。","選這個通常是還沒想到生殖細胞要先減半這一步；如果精細胞和卵細胞都是 2n，每一代套數都會加倍。","選這個通常是以為卵細胞比精細胞多一套；其實精細胞和卵細胞都由減數分裂產生，都只有一套，是 n。","選這個通常是以為胚還小，所以只有一套；胚由受精卵經細胞分裂發育，細胞分裂不改變套數，仍是 2n。"],"hints":["分兩類想：由減數分裂產生的細胞是 n；受精卵，以及由受精卵細胞分裂長出來的細胞是 2n。","精細胞、卵細胞是哪一類？受精卵＝n＋n＝？胚是受精卵分裂來的，套數會變嗎？"],"solution":["第一步，2n＝20 條，所以一套 n＝20 ÷ 2＝10 條。","第二步，精細胞和卵細胞都由減數分裂產生，只有一套，是 n（10 條）。","第三步，受精時精細胞和卵細胞結合：n＋n＝2n（20 條），所以受精卵是 2n。","第四步，受精卵在胚珠中經過細胞分裂，發育成胚。細胞分裂不改變染色體數目，所以胚的細胞還是 2n。","結論：依序是 n、n、2n、2n。"],"id":"r04v2"}]},{"type":"r05","section":"g2","title":"有性或無性生殖","variants":[{"stem":"下列五種生殖現象：\n甲：草莓的走莖（貼著地面長的莖）碰到土壤後，長出新植株\n乙：青蛙在水中產卵，雄蛙在卵上排出精子\n丙：酵母菌身上長出芽體，芽體脫落後成為新個體\n丁：玉米的花粉落到雌蕊的柱頭（雌蕊最上面、會黏住花粉的地方）上，之後結出種子\n戊：馬鈴薯塊莖（長在地下、變肥大的莖）上的芽眼，長出新植株\n哪些過程中「一定」會產生新的遺傳物質組合？","options":["乙、丁","丁","乙、丁、戊","甲、丙、戊"],"answer":0,"why":["正確：乙和丁都有精子（精細胞）和卵結合，是有性生殖，一定產生新的遺傳物質組合。","選這個通常是以為在體外受精就不算有性生殖；青蛙的精子和卵在水中結合，一樣是受精，也會產生新組合。","選這個通常是以為長出新植株就有新組合；馬鈴薯用塊莖長新株，沒有精卵結合，是無性生殖。","選這個通常是把有性和無性記反；這三個都沒有精卵結合，新個體和親代一模一樣。"],"hints":["先判斷每一個有沒有「精子（或精細胞）和卵結合」。有的才是有性生殖，才會有新組合。","乙：精子排在卵上，精子和卵會不會結合？丁：花粉到柱頭後，最後有沒有受精？甲、丙、戊有沒有精卵結合？"],"solution":["先弄懂「新的遺傳物質組合」：子代的遺傳物質一半來自爸爸、一半來自媽媽，混在一起，變成和爸媽都不完全一樣的組合。就像你有點像爸爸、有點像媽媽，但不是任何一個人的複製品。","判斷方法一：有精子（或精細胞）和卵結合 → 有性生殖 → 有新組合。","判斷方法二：沒有精卵結合，由身體一部分長出來 → 無性生殖 → 和親代一模一樣。","甲：草莓由走莖長新株，沒有精卵結合，是無性生殖。用根、莖、葉（營養器官）長出新植株，叫營養器官繁殖。","乙：青蛙的精子和卵在水中結合，叫體外受精。有受精，是有性生殖。","丙：酵母菌出芽，芽體由親代身體長出，是無性生殖。","丁：花粉落到柱頭上叫授粉。之後花粉長出一條細管（花粉管），把精細胞送到卵細胞那裡結合成受精卵，再發育成種子，是有性生殖。","戊：馬鈴薯塊莖是莖，由莖長新株，是無性生殖。","所以一定有新組合的是乙、丁。"],"id":"r05v1"},{"stem":"下列五種生物的產生方式：\n甲：用人工授粉得到蘭花種子，播種後長出的蘭花\n乙：用組織培養大量生產的蘭花苗\n丙：渦蟲被切成兩段後，各自長成一隻新渦蟲\n丁：受精的雞蛋孵出的小雞\n戊：用嫁接方式繁殖出的芒果苗\n哪些在產生的過程中「一定」會出現新的遺傳物質組合？","options":["甲、丁","甲、乙","甲、丁、戊","丁"],"answer":0,"why":["正確：甲的種子和丁的受精蛋，都是精細胞（精子）和卵結合產生的，是有性生殖，一定有新組合。","選這個通常是以為兩種都是蘭花、都用了人工技術就一樣；組織培養只是讓一小塊組織長成新株，沒有精卵結合，是無性生殖。","選這個通常是以為嫁接把兩株植物接在一起，就會混出新組合；接上去的枝條保有原來的遺傳物質，沒有精卵結合。","選這個通常是以為人工授粉是人做的，就不算有性生殖；只要有精細胞和卵細胞結合，就是有性生殖。"],"hints":["不要看是不是人工操作，只看有沒有「精細胞（精子）和卵結合」。","甲：種子是怎麼來的？有沒有受精？乙、丙、戊：新個體是由身體的一部分長出來，還是由受精卵長出來？"],"solution":["新的遺傳物質組合：子代的遺傳物質一半來自父方、一半來自母方，混成和雙親都不完全一樣的組合。只有精細胞（精子）和卵結合的有性生殖，才會產生新組合。","甲：人工授粉是由人把花粉放到柱頭上。之後花粉會長出一條細管（花粉管），把精細胞往下送到卵細胞那裡，兩者結合，才形成種子。所以是有性生殖。","乙：組織培養是取植物的一小塊組織，在培養瓶中讓它長成新植株。沒有精卵結合，是無性生殖。","丙：渦蟲斷成兩段各自長成新個體，叫做再生，沒有精卵結合，是無性生殖。","丁：受精的雞蛋，裡面有精子和卵結合成的受精卵，是有性生殖。","戊：嫁接是把一株植物的枝條接到另一株植物上。枝條還是原來那一株的遺傳物質，沒有精卵結合，是無性生殖。","所以一定有新組合的是甲、丁。"],"id":"r05v2"}]},{"type":"r06","section":"g2","title":"保留或培育品種","variants":[{"stem":"阿姨的花園裡有一株玫瑰，花色特別漂亮。她想大量繁殖，讓新植株都開出和這株一模一樣的花。下列哪一個方法和理由最適合？","options":["剪下這株玫瑰的枝條來扦插；因為這是無性生殖，新植株的遺傳物質和原來那株相同","收集這株玫瑰結的種子來播種；因為種子是這株玫瑰結出來的，所以長出來會一模一樣","讓這株玫瑰和另一株不同顏色的玫瑰進行人工授粉；因為可以得到更多種子","剪下這株玫瑰的枝條來扦插；因為扦插會產生新的遺傳物質組合，讓花更漂亮"],"answer":0,"why":["正確：扦插是由枝條長成新株，沒有精卵結合，新植株和原株遺傳物質相同，就像同一株的分身，花色能保留下來。","選這個通常是以為種子就是複製品；種子由受精後的胚珠發育而來，裡面的胚來自受精卵，有一半遺傳物質來自另一株的花粉，就像兄弟姊妹和爸媽長得不完全一樣。","選這個通常是把「要一樣」和「要新組合」弄反；和別株授粉會產生新組合，花色可能改變。","選這個通常是方法選對、理由記反；扦插是無性生殖，不會產生新組合，所以才能保持一模一樣。"],"hints":["先判斷目標：要「一模一樣」還是要「新組合」？要一模一樣，就要用無性生殖。","扦插、種子、人工授粉，哪一個沒有精卵結合？再檢查理由有沒有寫對。"],"solution":["第一步，看目標：阿姨要新植株開出「一模一樣」的花，也就是要保留原來的品種。","第二步，想規則：要一模一樣，就用無性生殖。無性生殖沒有精卵結合，子代的遺傳物質和親代相同。","第三步，判斷方法：扦插是剪下枝條插在土裡長成新株，屬於無性生殖，等於是同一株的分身。播種和人工授粉都經過受精，屬於有性生殖。","第四步，想想種子為什麼不行：種子像這株玫瑰的「孩子」，有一半遺傳物質來自別株玫瑰的花粉。所以種子長出來的花，不一定和這株一樣。","第五步，檢查理由：扦插的理由是「遺傳物質和原株相同」，而不是「產生新組合」。","所以答案是：剪下枝條扦插，因為無性生殖讓新植株的遺傳物質和原株相同。"],"id":"r06v1"},{"stem":"農業改良場有兩個品種的番茄：甲品種很能抵抗病害，但果實小；乙品種果實又大又甜，但容易生病。研究人員想培育出「又抗病、果實又大又甜」的新品種。下列哪一個方法和理由最適合？","options":["先讓甲、乙兩品種互相授粉，播下得到的種子，再從長出的植株中挑出好的；因為有性生殖會產生新的遺傳物質組合","把甲品種的枝條嫁接到乙品種的植株上；因為兩種枝條接在一起，特徵就會混合","用組織培養大量繁殖乙品種；因為植株數量變多，總會出現能抗病的植株","把甲、乙兩品種的枝條各自扦插；因為扦插長得快，可以很快選出好品種"],"answer":0,"why":["正確：互相授粉後，精細胞和卵細胞結合，種子帶有兩個品種的遺傳物質，才有機會出現同時具有兩種優點的新組合。","選這個通常是以為接在一起特徵就會混合；嫁接是無性生殖，甲枝條結的果還是甲品種，乙的部分還是乙品種。","選這個通常是以為數量多就會出現新特徵；組織培養是無性生殖，每一株都和乙品種一樣，一樣容易生病。","選這個通常是以為長得快就能變出新品種；扦插是無性生殖，長出來的還是原來的甲和乙，沒有新組合。"],"hints":["先判斷目標：要保留原品種，還是要培育「新品種」？新品種需要新的遺傳物質組合。","哪一種方法有精細胞和卵細胞結合，能把甲、乙兩個品種的遺傳物質放在一起？"],"solution":["第一步，看目標：研究人員要的是「新品種」，要把甲的抗病和乙的大又甜放在同一株上。","第二步，想規則：要產生新的遺傳物質組合，只能用有性生殖，也就是要有精細胞和卵細胞結合。","第三步，判斷方法：嫁接、組織培養、扦插都是無性生殖，長出來的植株和原來的品種一模一樣，不會產生新組合。","第四步，互相授粉：例如把甲品種的花粉放到乙品種的柱頭上。受精後的種子，同時帶有甲、乙的遺傳物質。","第五步，這些種子長出的植株各不相同，研究人員再從中挑出又抗病、果實又大又甜的。","所以答案是：讓甲、乙兩品種互相授粉，播種後挑選，因為有性生殖會產生新組合。"],"id":"r06v2"}]},{"type":"r07","section":"g3","title":"授粉與受精","variants":[{"stem":"一隻蜜蜂在花間採蜜，把甲花的花粉帶到了乙花雌蕊的柱頭上。\n雌蕊由上到下是：柱頭，會黏住花粉；花柱，細長的管子；子房，下面鼓起來的地方。子房裡有胚珠，胚珠裡有卵細胞。\n關於這一步和之後的發展，下列敘述何者正確？","options":["花粉落到柱頭上，這一步叫做授粉；這時候還沒有受精","花粉落到柱頭上，這一步叫做受精；這時候精細胞已經和卵細胞結合","花粉落到柱頭後，花粉會直接進入子房，不需要長出花粉管","受精發生在柱頭上，精細胞和卵細胞在柱頭表面結合"],"answer":0,"why":["正確：授粉只是花粉到達柱頭；卵細胞在胚珠裡，花粉還要長出花粉管把精細胞送進去，才會受精。","選這個通常是把授粉當成受精；花粉落到柱頭只是授粉，精細胞和卵細胞還離得很遠。","選這個通常是不知道花粉管的用處；花粉留在柱頭上，要靠長出的花粉管穿過花柱，才能到達胚珠。","選這個通常是記錯受精的地點；卵細胞在子房內的胚珠裡，受精發生在胚珠中，不在柱頭。"],"hints":["授粉＝花粉到達柱頭；受精＝精細胞和卵細胞結合。兩件事不一樣，中間還隔一段路。","花粉在最上面的柱頭，卵細胞在最下面子房裡的胚珠中。兩者中間隔著花柱，要靠什麼把精細胞送過去？"],"solution":["第一步，找位置：花粉落在最上面的柱頭上；卵細胞在最下面子房裡的胚珠中。柱頭和子房中間隔著一段花柱。","第二步，授粉：花粉從花藥（雄蕊頂端，裝花粉的地方）移到柱頭上，這一步叫做授粉。蜜蜂做的就是這件事。","第三步，花粉管：花粉在柱頭上長出一條細管，叫做花粉管。它穿過花柱，一路伸到胚珠。","第四步，受精：花粉管把精細胞送到胚珠，精細胞和卵細胞結合成受精卵，這一步才叫受精。","所以花粉落到柱頭上只是授粉，這時候還沒有受精。"],"id":"r07v1"},{"stem":"百香果開花後，果農用毛筆沾取花粉，輕輕塗在另一朵花雌蕊的柱頭上。（雌蕊由上到下是柱頭、花柱、子房；子房裡有胚珠，胚珠裡有卵細胞。）關於這個做法和之後的過程，下列敘述何者正確？","options":["果農做的是人工授粉；之後花粉要長出花粉管，把精細胞送到胚珠，才能完成受精","果農做的是人工受精；花粉一碰到柱頭，精細胞就和卵細胞結合了","花粉管的作用，是把胚珠裡的卵細胞送到柱頭，和花粉相遇","只要完成授粉，就算沒有受精，子房也能長成裡面有種子的果實"],"answer":0,"why":["正確：把花粉放到柱頭上是授粉；花粉管把精細胞送到胚珠，和卵細胞結合，才是受精。","選這個通常是把授粉當成受精；花粉碰到柱頭時，精細胞還在花粉裡，離卵細胞很遠。","選這個通常是把花粉管的方向記反；花粉管由花粉長出、往下伸到胚珠，送的是精細胞，卵細胞一直留在胚珠裡。","選這個通常是以為授粉就夠了；種子由受精後的胚珠發育而來，沒有受精就不會有種子。"],"hints":["授粉＝花粉到達柱頭；受精＝精細胞和卵細胞結合。先判斷果農做的是哪一件。","花粉在柱頭，卵細胞在胚珠。誰往誰的方向移動？靠的是什麼構造？"],"solution":["第一步，果農把花粉放到柱頭上，這一步叫做授粉。因為是人做的，叫人工授粉。","第二步，授粉後，花粉在柱頭上長出一條細管，叫花粉管。花粉管穿過花柱，往下伸到子房裡的胚珠。","第三步，花粉管把精細胞送到胚珠。卵細胞一直待在胚珠裡，不會移動。","第四步，精細胞和卵細胞結合成受精卵，這才叫受精。","第五步，受精後，胚珠發育成種子，子房發育成果實。沒有受精，就不會有種子。","所以正確的是：果農做的是人工授粉，之後要靠花粉管送精細胞到胚珠，才能受精。"],"id":"r07v2"}]},{"type":"r08","section":"g3","title":"子房與胚珠","variants":[{"stem":"某種植物的一朵花只有 1 個雌蕊，它的子房中有 30 個胚珠。授粉後，只有 24 個胚珠完成受精。在正常情況下，這朵花最後會發育成幾個果實？果實裡會有幾粒種子？","options":["1 個果實；24 粒種子","1 個果實；30 粒種子","30 個果實；30 粒種子","24 個果實；24 粒種子"],"answer":0,"why":["正確：1 個子房發育成 1 個果實；只有受精的胚珠會變成種子，所以是 24 粒。","選這個通常是以為所有胚珠都會變成種子；沒有受精的 6 個胚珠不會發育成種子。","選這個通常是把胚珠當成會變成果實；果實由子房發育而來，一個子房只長成一個果實。","選這個通常是把「胚珠變種子」和「子房變果實」混在一起；24 個受精胚珠變成 24 粒種子，但它們都在同一個果實裡。"],"hints":["記住兩條對應：子房 → 果實；受精的胚珠 → 種子。","這朵花有幾個子房？30 個胚珠中，哪些才會變成種子？"],"solution":["第一步，先認構造：子房是雌蕊下方鼓起來的部分；胚珠是子房裡面的小顆粒，裡面有卵細胞。","可以想成豌豆：子房就像豆莢，胚珠就像豆莢裡一顆顆的豆子。豆莢變成果實，豆子變成種子；一個豆莢裡可以有很多顆豆子。","第二步，果實：子房會發育成果實。這朵花只有 1 個雌蕊，也就是 1 個子房，所以長成 1 個果實。","第三步，種子：胚珠受精後才會發育成種子。30 個胚珠中只有 24 個受精，所以有 24 粒種子。","第四步，沒有受精的 6 個胚珠，不會發育成種子。","結論：1 個果實，裡面有 24 粒種子。"],"id":"r08v1"},{"stem":"小芳切開一顆西瓜，數到裡面有 200 粒發育完整的黑色種子。已知這顆西瓜是由一朵花的雌蕊發育而來。下列推論何者最合理？","options":["這顆西瓜由 1 個子房發育而來，這個子房中至少有 200 個胚珠","這顆西瓜由 200 個子房發育而來，每個子房各長成 1 粒種子","這顆西瓜由 1 個胚珠發育而來，胚珠裡的 200 個子房長成了種子","這顆西瓜由 1 個子房發育而來，子房中只要有 1 個胚珠，就能長出 200 粒種子"],"answer":0,"why":["正確：一個果實由一個子房發育而來；一粒種子由一個受精的胚珠發育而來，200 粒種子至少需要 200 個胚珠。","選這個通常是把子房當成會變成種子；子房變成的是果實，一顆西瓜只來自一個子房。","選這個通常是把子房和胚珠的位置記反；胚珠在子房裡面，子房發育成果實，胚珠發育成種子。","選這個通常是以為一個胚珠能長出很多種子；一個受精的胚珠只發育成一粒種子。"],"hints":["用兩條對應反推：果實 ← 子房；種子 ← 受精的胚珠。","一顆西瓜是一個果實，對應幾個子房？200 粒種子，需要幾個受精的胚珠？為什麼要說「至少」？"],"solution":["第一步，從果實反推：果實由子房發育而來。一顆西瓜是一個果實，所以來自 1 個子房。","第二步，從種子反推：一粒種子由一個受精的胚珠發育而來。200 粒種子，代表至少有 200 個胚珠完成受精。","第三步，說「至少」的原因：有些胚珠可能沒有受精，就不會長成種子。所以子房中的胚珠數可能比 200 多，但不會比 200 少。","第四步，也記住位置：胚珠在子房裡面，就像豆子在豆莢裡面，不是子房在胚珠裡面。","結論：這顆西瓜由 1 個子房發育而來，子房中至少有 200 個胚珠。"],"id":"r08v2"}]},{"type":"r09","section":"g4","title":"受精與生育方式","variants":[{"stem":"下表是三種動物的生殖方式：\n動物｜受精方式｜生育方式\n青蛙｜體外受精｜卵生\n烏龜｜體內受精｜卵生\n海豚｜體內受精｜胎生\n根據此表，下列敘述何者正確？","options":["體內受精的動物，不一定是胎生","體內受精的動物，一定是胎生","卵生的動物，一定是體外受精","生活在水中的動物，一定是體外受精"],"answer":0,"why":["正確：烏龜是體內受精，卻是卵生；「不一定」就是有的是、有的不是，所以這句對。","選這個通常是把「體內受精」和「胎生」當成同一件事；表中的烏龜就是體內受精但卵生。","選這個通常是以為產卵的動物都在體外受精；表中的烏龜是卵生，卻是體內受精。","選這個通常是以為住在水中就一定體外受精；表中的海豚住在水中，卻是體內受精。"],"hints":["受精方式（精卵在哪裡結合）和生育方式（寶寶在哪裡長大）是兩件不同的事，要分開看。","找找表中有沒有「體內受精但卵生」的動物？有沒有「住在水中但體內受精」的動物？"],"solution":["先學一個判斷技巧：句子裡有「一定」，只要在表裡找到一個不符合的動物，這句就錯了。","受精方式：精子和卵在哪裡結合。體內受精是在母體內結合；體外受精是在母體外（例如水中）結合。","卵生：媽媽把卵生出來，小寶寶在卵裡長大。","胎生：小寶寶在媽媽肚子裡的子宮長大，再生出來。","檢查「體內受精一定是胎生」：烏龜是體內受精，卻是卵生，找到例外，所以這句錯。","檢查「卵生一定是體外受精」：烏龜是卵生，卻是體內受精，找到例外，所以這句錯。","檢查「生活在水中一定是體外受精」：海豚生活在水中，卻是體內受精，找到例外，所以這句錯。","檢查「體內受精不一定是胎生」：「不一定」的意思是有些是、有些不是。海豚是體內受精又胎生，烏龜是體內受精卻卵生，所以這句正確。"],"id":"r09v1"},{"stem":"小安觀察到某種動物：雌雄會先交配，之後雌性在巢中產下外面有硬殼的卵，小動物從卵中孵出來。根據這些觀察，下列推論何者最合理？","options":["這種動物是體內受精，因為卵殼在產卵前就包好了，精子進不去","這種動物是卵生，所以一定是體外受精","這種動物有交配行為，是體內受精，所以一定是胎生","這種動物的胚胎發育時，主要靠母體經由胎盤供給養分"],"answer":0,"why":["正確：有交配，代表精子被送進母體內；而且硬殼在產卵前就包好，精子進不去，所以一定是在母體內受精。","選這個通常是以為產卵的動物都是體外受精；像雞、烏龜這類產硬殼卵的動物，都是體內受精但卵生。","選這個通常是以為體內受精就一定是胎生；題目說牠產下卵、小動物從卵中孵出，這是卵生。","選這個通常是把卵生和胎生的養分來源記混；胎盤（胎生動物連接寶寶和媽媽子宮的構造，用來送養分）只有胎生動物才有，卵生動物的胚胎靠卵黃提供養分。"],"hints":["分兩件事判斷：受精方式看精卵在哪裡結合；生育方式看寶寶在哪裡長大。","雌雄先交配，精子被送到哪裡？小動物從卵中孵出，是卵生還是胎生？"],"solution":["第一步，先看最簡單的線索：雌雄會交配。交配代表精子被送進母體內，所以是體內受精。","第二步，再看硬殼：卵殼在卵產出之前，就已經在母體內包好了。精子無法穿過硬殼，所以精子和卵一定要在包殼之前、在母體內結合。這也說明牠是體內受精。","第三步，判斷生育方式：雌性產下卵，小動物從卵中孵出，寶寶在母體外的卵裡長大，所以是卵生。","第四步，所以這種動物是「體內受精、卵生」，像雞、烏龜一樣。","第五步，卵生動物的胚胎在卵裡發育，主要靠卵黃提供養分。胎盤（連接寶寶和媽媽子宮的構造）只有胎生動物才有。","結論：最合理的推論是「體內受精，因為卵殼在產卵前就包好了，精子進不去」。"],"id":"r09v2"}]},{"type":"r10","section":"g4","title":"卵的構造與養分","variants":[{"stem":"雞蛋的構造有：卵黃（就是蛋黃），卵黃表面有一個小白點，叫胚盤；卵白（打蛋時透明、黏黏的部分）；卵殼膜（剝水煮蛋時，殼裡面那層薄膜）；卵殼。\n關於一顆受精的雞蛋，下列敘述何者正確？","options":["卵黃是卵細胞的一部分，儲存胚胎發育所需的主要養分","卵殼是卵細胞的細胞膜，由卵巢產生，用來保護胚胎","卵白就是卵細胞，以後會發育成小雞","胚盤儲存大量養分，是胚胎主要的食物來源"],"answer":0,"why":["正確：卵細胞由卵巢產生，包含卵黃和胚盤；卵黃儲存大量養分，供胚胎發育使用。","選這個通常是以為最外層也是卵細胞的一部分；卵殼是卵經過輸卵管（從卵巢通往體外的管子）時才包上的，不是卵細胞的膜，也不是卵巢產生的。","選這個通常是以為卵白就是卵；卵白是卵經過輸卵管時包上的，提供水分和部分養分，也能緩衝保護；卵細胞是中間的卵黃加上胚盤。","選這個通常是把胚盤和卵黃的功能記反；胚盤是卵黃表面的小白點，會發育成胚胎，養分主要來自卵黃。"],"hints":["卵巢只做出「卵黃＋胚盤」，這就是卵細胞，整顆蛋黃是一個很大的細胞。卵白、卵殼膜、卵殼是卵經過輸卵管（從卵巢通往體外的管子）時，才一層層包上去的。","卵細胞＝卵黃＋胚盤。這兩個中，哪一個是會發育成小雞的小白點？哪一個是又大又黃、裝滿養分的部分？"],"solution":["第一步，分來源：卵巢產生的卵細胞，就是中間的卵黃，加上卵黃表面的胚盤（一個小白點）。沒錯，整顆蛋黃是一個很大的細胞。","第二步，卵經過輸卵管（從卵巢通往體外的管子）往外走時，才依序包上卵白、卵殼膜、卵殼。所以這三個都不是卵細胞，也不是卵巢產生的。","第三步，分功能：胚盤會發育成胚胎（小雞）。卵黃儲存大量養分，是胚胎主要的養分來源。","第四步，卵白提供水分和部分養分，也有緩衝保護作用。卵殼和卵殼膜負責保護，卵殼上有小孔可以讓空氣進出。","結論：正確的是「卵黃是卵細胞的一部分，儲存胚胎發育所需的主要養分」。"],"id":"r10v1"},{"stem":"打開一顆受精的鴨蛋，可以看到中間黃色的卵黃，卵黃表面有一個小白點，叫胚盤。卵黃外面依序是透明的卵白、薄薄的卵殼膜，最外面是硬硬的卵殼。\n關於這顆鴨蛋，下列敘述何者正確？","options":["胚盤在卵黃表面，受精後會發育成小鴨的胚胎","卵黃會發育成小鴨的身體，胚盤負責提供養分","卵白和卵殼都是卵巢產生的，屬於卵細胞的一部分","卵殼完全密封、沒有小孔，胚胎發育時不需要和外界交換空氣"],"answer":0,"why":["正確：胚盤是卵細胞中會發育的部分，受精後發育成胚胎，再長成小鴨。","選這個通常是把胚盤和卵黃的功能記反；卵黃又大又黃，是儲存養分的倉庫，會發育成小鴨的是小白點胚盤。","選這個通常是以為整顆蛋都是卵細胞；卵巢只做出卵黃和胚盤，卵白和卵殼是卵經過輸卵管（從卵巢通往體外的管子）時才包上去的。","選這個通常是以為硬殼一定密不通風；卵殼上有許多小孔，讓氧氣進來、二氧化碳出去，胚胎才能呼吸。"],"hints":["先分兩件事：哪個構造會發育成小鴨？哪個構造儲存養分？再想卵白、卵殼是哪裡做出來的。","卵細胞＝卵黃＋胚盤，其中一個是小白點、一個是大大的養分倉庫。胚胎在殼裡要不要呼吸？"],"solution":["第一步，分來源：卵巢做出的卵細胞是卵黃加上胚盤。卵白、卵殼膜、卵殼是卵經過輸卵管（從卵巢通往體外的管子）時，才一層層包上去的。","第二步，分功能：胚盤受精後會發育成胚胎，長成小鴨。卵黃儲存大量養分，供胚胎使用。","第三步，卵白提供水分和部分養分，也能緩衝保護。卵殼和卵殼膜負責保護。","第四步，卵殼上有許多小孔，空氣可以進出。胚胎因此能得到氧氣、排出二氧化碳。","構造｜從哪裡來｜功能\n胚盤｜卵巢（卵細胞的一部分）｜發育成胚胎\n卵黃｜卵巢（卵細胞的一部分）｜儲存養分\n卵白｜輸卵管包上｜提供水分和部分養分、緩衝保護\n卵殼膜、卵殼｜輸卵管包上｜保護；卵殼有小孔讓空氣進出","結論：正確的是「胚盤在卵黃表面，受精後會發育成小鴨的胚胎」。"],"id":"r10v2"}]}],"figs":{"egg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAA
